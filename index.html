              </Card>
            )}
          </div>
        )}

        {/* VENDORS TAB */}
        {tab==='vendors'&&(
          <div>
            <div style={{marginBottom:14}}><Alert type="info">Assign vendor {prog.abbr} status. This informs qualification review but does not override explicit QE/NQ tags on individual lines.</Alert></div>
            {Object.keys(vendors).length===0?(
              <div style={{textAlign:'center',color:'var(--text3)',padding:'40px',background:'var(--bg3)',borderRadius:'var(--radius-lg)'}}>No vendors detected yet. Process GL lines in Step 2 first.</div>
            ):(
              <Card>
                <SectionHead label={`Vendors (${Object.keys(vendors).length})`}/>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                    <thead><tr style={{background:'var(--bg3)',borderBottom:'0.5px solid var(--border)'}}>{['Vendor Name',`${prog.abbr} Status`,'GL Lines','Total Spend','Status'].map(h=><th key={h} style={{padding:'8px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</th>)}</tr></thead>
                    <tbody>
                      {Object.entries(vendors).sort((a,b)=>a[0].localeCompare(b[0])).map(([name,v])=>{
                        const vlines=lines.filter(l=>l.vendor===name);
                        const vtotal=sumAmt(vlines);
                        return (
                          <tr key={name} style={{borderBottom:'0.5px solid var(--border)'}}>
                            <td style={{padding:'9px 14px',fontWeight:500,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{name}</td>
                            <td style={{padding:'9px 14px'}}>
                              <select value={v.status||''} onChange={e=>updateVendor(name,{status:e.target.value})} style={{background:'var(--bg3)',border:'0.5px solid var(--border2)',borderRadius:4,padding:'5px 8px',fontSize:12,color:v.status?'var(--text)':'var(--amber)'}}>
                                <option value="">— unset —</option>
                                <option value="IN">{prog.abbr} Vendor</option>
                                <option value="OUT">Out-of-State Vendor</option>
                                <option value="NA">Not Applicable</option>
                              </select>
                            </td>
                            <td style={{padding:'9px 14px',color:'var(--text2)'}}>{vlines.length}</td>
                            <td style={{padding:'9px 14px',fontWeight:600,fontVariantNumeric:'tabular-nums'}}>{fmt(vtotal)}</td>
                            <td style={{padding:'9px 14px'}}>{!v.status?<Chip color="amber" small>Needs status</Chip>:<Chip color="green" small>✓ Set</Chip>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </Card>
            )}
          </div>
        )}

        {/* WARNINGS TAB */}
        {tab==='warnings'&&(
          <div>
            {Object.keys(warnBreakdown).length>0&&(
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:10,marginBottom:20}}>
                {Object.entries(warnBreakdown).map(([w,cnt])=>(
                  <div key={w} style={{background:'var(--bg2)',border:'0.5px solid var(--border)',borderRadius:'var(--radius)',padding:'12px 16px'}}>
                    <div style={{fontSize:11,color:'var(--text3)',marginBottom:4,lineHeight:1.3}}>{w}</div>
                    <div style={{fontSize:22,fontWeight:700,color:'var(--amber)'}}>{cnt}</div>
                  </div>
                ))}
              </div>
            )}
            {totals.warns===0?<Alert type="success">No validation warnings. All lines are clean.</Alert>:(
              <>
                <div style={{marginBottom:12}}><Alert type="warning">Warnings do not block export. Resolve where possible before submitting to the state.</Alert></div>
                <Card>
                  <SectionHead label={`Lines with Warnings (${lines.filter(l=>l.warnings?.length>0).length})`}/>
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                      <thead><tr style={{background:'var(--bg3)',borderBottom:'0.5px solid var(--border)'}}>{['Src','Date','Vendor / Employee','Amount','Qual Status','Warnings'].map(h=><th key={h} style={{padding:'8px 12px',textAlign:'left',fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</th>)}</tr></thead>
                      <tbody>
                        {lines.filter(l=>l.warnings?.length>0).map(l=>(
                          <tr key={l.id} style={{borderBottom:'0.5px solid var(--border)'}}>
                            <td style={{padding:'7px 12px'}}><Chip color={l.src==='GL'?'navy':'teal'} small>{l.src}</Chip></td>
                            <td style={{padding:'7px 12px',color:'var(--text2)',fontSize:11}}>{l.date||'—'}</td>
                            <td style={{padding:'7px 12px',fontWeight:500,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.vendor||l.employee||'—'}</td>
                            <td style={{padding:'7px 12px',fontVariantNumeric:'tabular-nums',fontWeight:600}}>{fmtd(l.amount)}</td>
                            <td style={{padding:'7px 12px'}}><Pill val={l.qs}/></td>
                            <td style={{padding:'7px 12px'}}><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{l.warnings.map(w=><Chip key={w} color="amber" small>{w}</Chip>)}</div></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </Card>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── FORMULA INJECTION ESCAPE ────────────────────────────
// Prefix cells starting with =, +, -, @ with a tab to prevent Excel/Sheets
// from executing them as formulas. Only applied to string values.
function esc(v){
  if(typeof v!=='string')return v;
  if(v.length>0&&'=+-@\t\r'.includes(v[0]))return '\t'+v;
  return v;
}
function escRow(arr){return arr.map(esc);}
function ExportStep({project,onUpdate}){
  const [busy,setBusy]=useState(false);
  const [lastFile,setLastFile]=useState(null);
  const [error,setError]=useState('');
  const lines=project.lines||[];
  const vendors=project.vendors||{};
  const prog=getStateProgram(project.state);
  const stateCats=getStateCats(project.state);

  const qeLines=lines.filter(l=>l.qs==='QE');
  const nqLines=lines.filter(l=>l.qs==='NQ');
  const untLines=lines.filter(l=>l.qs==='Untagged');
  const nrLines=lines.filter(l=>l.qs==='Not Required');
  const glLines=lines.filter(l=>l.src==='GL');
  const payLines=lines.filter(l=>l.src==='Payroll');
  const warns=lines.reduce((s,l)=>s+(l.warnings?.length||0),0);
  const aiClassified=lines.filter(l=>l.qs_src&&l.qs_src.includes('AI classified')).length;
  const liveRules=project.liveRules;

  function doExport(){
    if(!lines.length)return;
    setBusy(true);setError('');
    try{
      const wb=XLSX.utils.book_new();
      const today=new Date().toISOString().split('T')[0];
      const catBreakdown={};
      lines.forEach(l=>{if(!l.cat)return;if(!catBreakdown[l.cat])catBreakdown[l.cat]={total:0,count:0,qualified:stateCats[l.cat]?.q?'Yes':'No'};catBreakdown[l.cat].total+=(l.amount||0);catBreakdown[l.cat].count++;});

      const summaryRows=[
        [`${prog.name.toUpperCase()} FILM TAX CREDIT — PRODUCTION ACCOUNTING SUMMARY`],[''],
        ['Project Name',project.name],['Production Entity',project.entity],
        ['State Program',`${prog.name} (${prog.abbr})`],['Credit / Incentive Rate',prog.rate],
        ['Budget Tier',project.tier],['Production Start',project.start||''],['Production End',project.end||''],
        ['Export Date',today],['AI-Classified Lines Approved',aiClassified],['Live Rule Check Saved',liveRules?.summary?'Yes':'No'],[''],
        ['QUALIFICATION SUMMARY','',''],['Status','Amount ($)','Line Count'],
        ['Qualifying Expenses (QE)',sumAmt(qeLines),qeLines.length],
        ['Non-Qualifying Expenses (NQ)',sumAmt(nqLines),nqLines.length],
        ['Untagged',sumAmt(untLines),untLines.length],
        ['Not Required',sumAmt(nrLines),nrLines.length],
        ['Grand Total',sumAmt(lines),lines.length],[''],
        ['SOURCE SUMMARY','',''],['GL Total',sumAmt(glLines),glLines.length],['Payroll Total',sumAmt(payLines),payLines.length],[''],
        ['VALIDATION','',''],['Total Warnings',warns,''],[''],
        ['CATEGORY BREAKDOWN','','',''],['Category','Qualified?','Amount ($)','Line Count'],
        ...Object.entries(catBreakdown).sort((a,b)=>b[1].total-a[1].total).map(([cat,v])=>[cat,v.qualified,v.total,v.count]),
      ];
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summaryRows),`${prog.abbr} Summary`);

      const qvHeaders=['Date','Account #','Account Name','Vendor','Memo','Department','Amount','Category','Qual Source','AI Confidence','Vendor Status'];
      const qvRows=qeLines.filter(l=>l.src==='GL').map(l=>escRow([l.date,l.acct,l.acct_name,l.vendor,l.memo,l.dept,l.amount,l.cat,l.qs_src,l.ai_confidence||'',vendors[l.vendor]?.status||'']));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([qvHeaders,...qvRows]),'Qualified Vendor List');

      const nqRows=nqLines.filter(l=>l.src==='GL').map(l=>escRow([l.date,l.acct,l.acct_name,l.vendor,l.memo,l.dept,l.amount,l.cat,l.qs_src,l.ai_confidence||'',vendors[l.vendor]?.status||'']));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([qvHeaders,...nqRows]),'Non-Qualified Vendor List');

      const payHeaders=['Employee','Date','Department','Amount','Residency','Qual Status','Qual Source','AI Confidence','AI Reason','Category'];
      const payRows=payLines.map(l=>escRow([l.employee,l.date,l.dept,l.amount,l.residency||'',l.qs,l.qs_src,l.ai_confidence||'',l.ai_reason||'',l.cat]));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([payHeaders,...payRows]),'Payroll Summary');

      if(liveRules?.summary){
        const liveRows=[
          ['Latest Rule Check Summary'],
          ['State',prog.name],
          ['Checked At',liveRules.checkedAt?new Date(liveRules.checkedAt).toLocaleString():''],
          ['Model',liveRules.model||''],
          [''],
          ['Summary'],
          [liveRules.summary],
          [''],
          ['Sources'],
          ...(liveRules.sources||[]).map(url=>[url]),
        ];
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(liveRows),'Live Rules');
      }

      const fname=`${(project.name||'Project').replace(/[^a-zA-Z0-9]/g,'_')}_${prog.abbr}_Export_${today}.xlsx`;
      XLSX.writeFile(wb,fname);
      const run={id:uid(),date:today,filename:fname,lines:lines.length,qe:sumAmt(qeLines),nq:sumAmt(nqLines),warns,aiClassified};
      onUpdate({...project,exports:[...(project.exports||[]),run]});
      setLastFile(fname);
    }catch(e){
      setError('Export failed: '+e.message);
    }
    setBusy(false);
  }

  const readiness=[
    {label:'Files processed',ok:lines.length>0,detail:`${lines.length.toLocaleString()} lines ready`},
    {label:'Untagged lines reviewed',ok:untLines.length===0,detail:untLines.length?`${untLines.length} still untagged`:'All lines tagged'},
    {label:'Warnings checked',ok:warns===0,detail:warns?`${warns} warnings remain`:'No warnings'},
    {label:'Live rule check saved',ok:!!liveRules?.summary,detail:liveRules?.summary?'Included in export workbook':'Optional but recommended'},
  ];

  return (
    <div style={{flex:1,padding:32,maxWidth:860}}>
      <PageHeader
        eyebrow="Step 4 of 4"
        title="Export package"
        subtitle={`Create the ${prog.name} workbook with clean tabs for summary, vendor lines, payroll, and the latest saved rule check.`}
        badge={<Chip color="teal">{prog.abbr} export</Chip>}
      />

      {error&&<Alert type="error" style={{marginBottom:14}}>{error}</Alert>}
      {lastFile&&<Alert type="success" style={{marginBottom:14}}>Downloaded: {lastFile}</Alert>}

      <div className="grid-auto-wide" style={{marginBottom:18}}>
        <Card>
          <SectionHead label="Export readiness"/>
          <div style={{padding:'16px 18px',display:'grid',gap:10}}>
            {readiness.map(item=><div key={item.label} style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center'}}><div><div style={{fontWeight:700,color:'var(--text)'}}>{item.label}</div><div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{item.detail}</div></div><Chip color={item.ok?'green':'amber'}>{item.ok?'Ready':'Review'}</Chip></div>)}
          </div>
        </Card>
        <Card>
          <SectionHead label="Qualification summary"/>
          <div style={{padding:'16px 18px',display:'grid',gap:10}}>
            {[['Qualifying (QE)',fmt(sumAmt(qeLines)),`${qeLines.length} lines`,'var(--teal)'],['Non-Qualifying (NQ)',fmt(sumAmt(nqLines)),`${nqLines.length} lines`,'var(--red)'],['Untagged',fmt(sumAmt(untLines)),`${untLines.length} lines`,'var(--amber)'],['Not Required',fmt(sumAmt(nrLines)),`${nrLines.length} lines`,'var(--text-3)'],['Grand Total',fmt(sumAmt(lines)),`${lines.length} lines`,'var(--navy)']].map(([label,val,sub,col])=><div key={label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid var(--border)',paddingBottom:8}}><span style={{fontSize:13,color:'var(--text)'}}>{label}</span><div style={{textAlign:'right'}}><div style={{fontWeight:800,color:col,fontSize:14}}>{val}</div><div style={{fontSize:11,color:'var(--text-3)'}}>{sub}</div></div></div>)}
          </div>
        </Card>
      </div>

      {aiClassified>0&&<div style={{marginBottom:14}}><Alert type="info">{aiClassified} lines were AI-classified and approved. Their confidence levels and reasons are included in the exported sheets.</Alert></div>}
      {untLines.length>0&&<div style={{marginBottom:14}}><Alert type="warning">You still have {untLines.length} untagged lines. You can export now, but this is usually worth reviewing first.</Alert></div>}
      {warns>0&&<div style={{marginBottom:18}}><Alert type="warning">{warns} validation warnings remain. Export is still allowed so you can keep moving.</Alert></div>}

      <Card style={{marginBottom:18}}>
        <SectionHead label="Workbook tabs"/>
        <div style={{padding:'16px 18px',display:'grid',gap:10}}>
          {[
            `1. ${prog.abbr} Summary — project info, totals, category breakdown`,
            '2. Qualified Vendor List — QE GL lines, vendor status, AI confidence',
            '3. Non-Qualified Vendor List — NQ GL lines',
            '4. Payroll Summary — all payroll lines with residency and AI details',
            liveRules?.summary?'5. Live Rules — saved rule check summary and source links':null,
          ].filter(Boolean).map(item=><div key={item} style={{display:'flex',gap:8,fontSize:13,color:'var(--text-2)'}}><span style={{color:'var(--teal)',fontWeight:800}}>✓</span><span>{item}</span></div>)}
        </div>
      </Card>

      <Btn variant="teal" onClick={doExport} disabled={busy||lines.length===0}>{busy?'Generating workbook…':lines.length===0?'No lines to export':'⬇ Download workbook'}</Btn>

      {(project.exports||[]).length>0&&(
        <div style={{marginTop:28}}>
          <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10,fontWeight:800}}>Export history</div>
          {[...(project.exports||[])].reverse().map(e=>(
            <div key={e.id} style={{background:'var(--bg-elevated)',border:`1px solid ${e.stale?'rgba(217,119,6,0.30)':'var(--border)'}`,borderRadius:'14px',padding:'12px 14px',marginBottom:8,display:'grid',gridTemplateColumns:'24px 1fr auto auto auto',gap:10,alignItems:'center',fontSize:12,boxShadow:'var(--shadow-sm)'}}>
              <span style={{fontSize:18}}>📥</span>
              <span style={{color:'var(--text-2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.filename}</span>
              <span style={{color:'var(--teal)',fontWeight:800,whiteSpace:'nowrap'}}>{fmt(e.qe)} QE</span>
              {e.stale&&<Chip color="amber" small>stale</Chip>}
              <span style={{color:'var(--text-3)',whiteSpace:'nowrap'}}>{e.date}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────
const LS_WELCOMED='filmtax_welcomed_v1';
function App(){
  const [projects,setProjects]=useState([]);
  const [project,setProject]=useState(null);
  const [view,setView]=useState('projects');
  const [loadingProjects,setLoadingProjects]=useState(true);
  const [storageMessage,setStorageMessage]=useState('');
  const [saveState,setSaveState]=useState('idle');
  const [storageMode,setStorageMode]=useState('indexeddb');
  const [showWelcome,setShowWelcome]=useState(()=>!loadApiKey()&&!localStorage.getItem(LS_WELCOMED));

  useEffect(()=>{
    let mounted=true;
    loadProjects()
      .then(data=>{if(mounted)setProjects(Array.isArray(data)?data:[]);})
      .catch(()=>{if(mounted)setStorageMessage('Could not load saved projects from browser storage.');})
      .finally(()=>{if(mounted)setLoadingProjects(false);});
    return ()=>{mounted=false;};
  },[]);

  useEffect(()=>{
    if(loadingProjects)return;
    let cancelled=false;
    const t=setTimeout(()=>{
      setSaveState('saving');
      saveProjects(projects)
        .then(()=>{if(cancelled)return;setSaveState('saved');setTimeout(()=>{if(!cancelled)setSaveState('idle');},1200);})
        .catch(()=>{if(cancelled)return;setStorageMode('localStorage');setSaveState('saved');setStorageMessage('IndexedDB was unavailable, so the app fell back to basic browser storage. Your work is still being saved, but very large projects may be less reliable.');});
    },250);
    return ()=>{cancelled=true;clearTimeout(t);};
  },[projects,loadingProjects]);

  function dismissWelcome(){
    localStorage.setItem(LS_WELCOMED,'1');
    setShowWelcome(false);
  }

  function createProject(p){setProjects(prev=>[...prev,p]);setProject(p);setView('upload');}
  function openProject(p){
    const latest=projects.find(x=>x.id===p.id)||p;
    const opened={...latest,lastOpenedAt:new Date().toISOString()};
    setProject(opened);
    setProjects(prev=>prev.map(item=>item.id===opened.id?opened:item));
    setView(getProjectSuggestedView(opened));
  }
  function updateProject(updated){setProject(updated);setProjects(prev=>prev.map(p=>p.id===updated.id?updated:p));}
  function deleteProject(id){
    setProjects(prev=>{
      const next=prev.filter(p=>p.id!==id);
      if(next.length===0)clearProjectStore().catch(()=>{});
      return next;
    });
    if(project?.id===id){setProject(null);setView('projects');}
  }

  function renderView(){
    if(loadingProjects){
      return <div style={{flex:1,padding:40,display:'flex',alignItems:'center',justifyContent:'center'}}><Card style={{padding:'34px 36px',maxWidth:420,textAlign:'center'}}><div style={{fontSize:34,marginBottom:12}}>🎬</div><div style={{fontWeight:900,fontSize:18,color:'var(--navy)',marginBottom:8}}>Loading your workspace…</div><div style={{fontSize:13,color:'var(--text-3)'}}>Reading saved projects from browser storage.</div></Card></div>;
    }
    if(view==='settings')return <SettingsPage onShowWelcome={()=>setShowWelcome(true)}/>;
    if(!project||view==='projects')return <ProjectsPage projects={projects} onCreate={createProject} onOpen={openProject} onDelete={deleteProject}/>;
    if(view==='upload')return <UploadStep project={project} onUpdate={updateProject}/>;
    if(view==='map')return <MapStep project={project} onUpdate={updateProject}/>;
    if(view==='review')return <ReviewStep project={project} onUpdate={updateProject}/>;
    if(view==='export')return <ExportStep project={project} onUpdate={updateProject}/>;
    return null;
  }

  const hasKey=!!loadApiKey();
  const saveLabel=saveState==='saving'?'Saving…':saveState==='saved'?'Saved':'Ready';
  const saveColor=saveState==='saving'?'navy':'green';

  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--bg)'}}>
      {showWelcome&&<WelcomeModal onDone={dismissWelcome}/>} 
      <Sidebar view={view} setView={setView} project={project} setProject={p=>{setProject(p);if(!p)setView('projects');}} hasKey={hasKey}/>
      <div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'14px 24px',borderBottom:'1px solid var(--border)',background:'rgba(255,255,255,0.82)',backdropFilter:'blur(10px)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,position:'sticky',top:0,zIndex:20}}>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <Chip color={saveColor}>{saveLabel}</Chip>
            <Chip color={storageMode==='indexeddb'?'green':'amber'}>{storageMode==='indexeddb'?'IndexedDB storage':'Fallback storage'}</Chip>
            {project&&<span style={{fontSize:12,color:'var(--text-3)'}}>Current project: <strong style={{color:'var(--navy)'}}>{project.name}</strong></span>}
          </div>
          <div style={{fontSize:12,color:'var(--text-3)'}}>Film Tax Credit Manager · Browser edition</div>
        </div>
        {storageMessage&&<div style={{padding:'12px 24px 0'}}><Alert type={storageMode==='indexeddb'?'error':'warning'}>{storageMessage}</Alert></div>}
        {renderView()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
