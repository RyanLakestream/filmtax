function fmt(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);}
function fmtd(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function sumAmt(arr){return arr.reduce((s,l)=>s+(Number(l.amount)||0),0);}
function getStateProgram(stateAbbr){return STATE_PROGRAMS[stateAbbr]||STATE_PROGRAMS.NJ;}
function getStateCats(stateAbbr){return getStateProgram(stateAbbr).cats;}
function countWarnings(lines){return (lines||[]).reduce((s,l)=>s+((l.warnings||[]).length||0),0);}
function getProjectSuggestedView(project){
  const uploads=project?.uploads||[];
  const lines=project?.lines||[];
  if(!uploads.length)return 'upload';
  if(!lines.length)return 'map';
  return 'review';
}
function getProjectHealth(project){
  const uploads=project?.uploads||[];
  const lines=project?.lines||[];
  const untagged=lines.filter(l=>l.qs==='Untagged').length;
  const warnings=countWarnings(lines);
  if(!uploads.length)return {label:'Needs files',color:'amber'};
  if(!lines.length)return {label:'Map columns',color:'navy'};
  if(untagged>0)return {label:'Review AI',color:'purple'};
  if(warnings>0)return {label:'Warnings to check',color:'amber'};
  return {label:'Ready to export',color:'green'};
}
function formatDate(value){
  if(!value)return '—';
  try{return new Date(value).toLocaleDateString();}catch{return value;}
}

// ─── BROWSER PERSISTENCE ────────────────────────────────
const DB_NAME='filmtax_manager_v3';
const DB_VERSION=1;
const DB_STORE='app_state';
const PROJECTS_KEY='projects';

function openDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('DB open failed'));
  });
}
function dbGet(key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readonly');
    const store=tx.objectStore(DB_STORE);
    const req=store.get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('DB read failed'));
  }));
}
function dbSet(key,value){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    const store=tx.objectStore(DB_STORE);
    const req=store.put(value,key);
    req.onsuccess=()=>resolve(true);
    req.onerror=()=>reject(req.error||new Error('DB write failed'));
  }));
}
function dbDelete(key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    const store=tx.objectStore(DB_STORE);
    const req=store.delete(key);
    req.onsuccess=()=>resolve(true);
    req.onerror=()=>reject(req.error||new Error('DB delete failed'));
  }));
}

const LS_FALLBACK_KEY='filmtax_projects_v3_fallback';
async function loadProjects(){
  try{
    const data=await dbGet(PROJECTS_KEY);
    if(Array.isArray(data))return data;
  }catch(_){/* fall through */}
  try{
    const raw=localStorage.getItem(LS_FALLBACK_KEY);
    return raw?JSON.parse(raw):[];
  }catch{return [];}
}

async function saveProjects(projects){
  try{
    await dbSet(PROJECTS_KEY,projects);
    try{localStorage.removeItem(LS_FALLBACK_KEY);}catch{}
  }catch(e){
    try{localStorage.setItem(LS_FALLBACK_KEY,JSON.stringify(projects));}catch{}
    throw e;
  }
}

async function clearProjectStore(){
  try{await dbDelete(PROJECTS_KEY);}catch(_){/* ignore */}
  try{localStorage.removeItem(LS_FALLBACK_KEY);}catch{}
}

function saveApiKey(k){try{localStorage.setItem(LS_API_KEY,k);}catch{}}

// ─── FILE PARSER ─────────────────────────────────────────
// CSV: PapaParse with auto-detect delimiter/newline and header trimming.
// XLSX/XLS: SheetJS with first non-empty row treated as headers so blank intro rows don't break import.
function sanitizeHeader(value,index){
  const text=String(value??'').trim();
  return text||`Column ${index+1}`;
}
function normalizeCell(value){
  if(value==null)return '';
  if(typeof value==='string')return value.trim();
  return value;
}

function parseWorkbookRows(ws){
  const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,dateNF:'yyyy-mm-dd',blankrows:false});
  const headerIndex=matrix.findIndex(row=>Array.isArray(row)&&row.some(cell=>String(cell??'').trim()!==''));
  if(headerIndex===-1)throw new Error('File appears empty or has no column headers');
  const headers=(matrix[headerIndex]||[]).map((h,i)=>sanitizeHeader(h,i));
  const rows=matrix.slice(headerIndex+1)
    .filter(row=>Array.isArray(row)&&row.some(cell=>String(cell??'').trim()!==''))
    .map(row=>{
      const obj={};
      headers.forEach((header,i)=>{obj[header]=normalizeCell(row[i]);});
      return obj;
    });
  return {headers,rows};
}

function parseFile(file){
  return new Promise((res,rej)=>{
    const ext=(file.name.toLowerCase().split('.').pop()||'').trim();
    const isCsv=['csv','tsv','txt'].includes(ext);

    if(isCsv){
      Papa.parse(file,{
        header:true,
        skipEmptyLines:'greedy',
        delimiter:'',
        newline:'',
        dynamicTyping:false,
        worker:false,
        transformHeader:(h,i)=>sanitizeHeader(h,i),
        transform:v=>normalizeCell(v),
        complete:result=>{
          const headers=(result.meta?.fields||[]).map((h,i)=>sanitizeHeader(h,i));
          if(!headers.length){rej(new Error('No headers found in CSV'));return;}
          const rows=(result.data||[]).filter(row=>Object.values(row||{}).some(v=>String(v??'').trim()!==''));
          res({headers,rows});
        },
        error:err=>rej(new Error('CSV parse error: '+err.message)),
      });
      return;
    }

    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array',cellText:true,cellDates:false});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const parsed=parseWorkbookRows(ws);
        res(parsed);
      }catch(err){rej(err);}
    };
    reader.onerror=()=>rej(new Error('Failed to read file'));
    reader.readAsArrayBuffer(file);
  });
}

// ─── MONEY PARSER ────────────────────────────────────────
// Handles US and EU-style numbers without relying on browser locale.
function parseMoney(value){
  if(value==null)return 0;
  let s=String(value).trim();
  if(!s||s==='-'||s==='—')return 0;

  const negative=/^\(.*\)$/.test(s)||s.startsWith('-')||s.endsWith('-');
  s=s.replace(/[()]/g,'').replace(/^-/,'').replace(/-$/,'').trim();

  // Remove currency text/symbols, keep digits and separators.
  s=s.replace(/[^\d.,'\s]/g,'').trim();
  if(!s)return 0;

  // Remove spaces/apostrophes used as group separators.
  s=s.replace(/[\s']/g,'');

  const lastDot=s.lastIndexOf('.');
  const lastComma=s.lastIndexOf(',');
  let decimal='';

  if(lastDot>-1 && lastComma>-1){
    decimal=lastDot>lastComma?'.':',';
  }else if(lastDot>-1){
    const digitsAfter=s.length-lastDot-1;
    decimal=digitsAfter===0?'':(digitsAfter<=2?'.':'');
  }else if(lastComma>-1){
    const digitsAfter=s.length-lastComma-1;
    decimal=digitsAfter===0?'':(digitsAfter<=2?',':'');
  }

  if(decimal){
    const group=decimal==='.'?',':'.';
    s=s.split(group).join('');
    if(decimal!=='.')s=s.replace(decimal,'.');
  }else{
    s=s.replace(/[.,]/g,'');
  }

  const n=Number(s);
  if(!Number.isFinite(n))return 0;
  return negative?-n:n;
}

// ─── QUAL TAG NORMALIZER ──────────────────────────────────
// Handles common ledger export variants: QE, Q/E, QUALIFYING,
// NQ, NON-QUAL, NONQUALIFYING, NR, NOT REQUIRED, etc.
function normalizeQualTag(raw){
  const norm=String(raw??'').trim().toUpperCase().replace(/[\-_]+/g,' ').replace(/\s+/g,' ').trim();
  if(!norm)return 'Untagged';
  if(['QE','Q/E','Q E'].includes(norm) || /^QUAL(IFY|IFYING|IFIED)?/.test(norm))return 'QE';
  if(['NQ','N Q','NON QE','NONQ'].includes(norm) || /^(NON ?QUAL|NONQUALIFYING|NOT QUAL|NOT QUALIFYING)/.test(norm))return 'NQ';
  if(['NR','N/R','N R','NOT REQUIRED','NOTREQUIRED','NOT REQ','NOTREQ','NOT APPLICABLE','NOTAPPLICABLE','NA','N A'].includes(norm))return 'Not Required';
  return 'Untagged';
}

// ─── AI CLASSIFICATION ───────────────────────────────────
const CLAUDE_API_URL='https://api.anthropic.com/v1/messages';
const CLAUDE_API_VERSION='2023-06-01';
// Anthropic announced Claude Sonnet 4 retirement for June 15, 2026, so use Sonnet 4.6 going forward.
const CLAUDE_MODEL='claude-sonnet-4-6';

async function requestClaude(apiKey, body){
  const resp=await fetch(CLAUDE_API_URL,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':CLAUDE_API_VERSION,
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify(body),
  });
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok){
    const message=data?.error?.message||`API error ${resp.status}`;
    throw new Error(message);
  }
  return data;
}

function extractTextBlocks(data){
  return (data?.content||[])
    .filter(block=>block?.type==='text' && typeof block.text==='string')
    .map(block=>block.text)
    .join('\n')
    .trim();
}

function extractWebSources(data){
  const urls=[];
  (data?.content||[]).forEach(block=>{
    if(block?.type==='web_search_tool_result' && Array.isArray(block.content)){
      block.content.forEach(item=>{if(item?.url)urls.push(item.url);});
    }
    if(block?.type==='text' && Array.isArray(block.citations)){
      block.citations.forEach(c=>{if(c?.url)urls.push(c.url);});
    }
  });
  return [...new Set(urls)].slice(0,6);
}

async function verifyApiKey(apiKey){
  await requestClaude(apiKey,{model:CLAUDE_MODEL,max_tokens:16,messages:[{role:'user',content:'Reply with OK.'}]});
  return true;
}

// Step 1: fetch latest rules from the web via Claude's web_search tool.
async function fetchLiveRules(stateAbbr, apiKey, onStatus){
  const program=getStateProgram(stateAbbr);
  const year=new Date().getFullYear();
  const isNY=stateAbbr==='NY';
  const prompt=isNY
    ?`Find the most current New York State film AND commercial tax incentive qualification rules for ${year}. Cover both the main NY Film Production Tax Credit AND the NY Commercial Production Tax Credit (downstate 20% / upstate 30%). Focus on: 1) what expenses qualify for each program, 2) what does not qualify — especially that commercials exclude directors, writers, and principal performers (only background extras qualify for labor), 3) minimum spend thresholds ($500K downstate, $100K upstate for commercials), 4) any rule or rate changes from the past 12 months. Prefer official ESD sources. Concise plain-English summary for a production accountant.`
    :`Find the most current ${program.name} film tax incentive qualification rules for ${year}. Focus on: 1) what expenses qualify, 2) what does not qualify, 3) any rule or rate changes from the past 12 months, and 4) how above-the-line vs below-the-line costs are treated. Prefer official state or film-office sources when available. Respond with a concise plain-English summary for a production accountant.`;

  if(onStatus)onStatus('Checking the latest '+program.name+' rules…');
  try{
    const data=await requestClaude(apiKey,{
      model:CLAUDE_MODEL,
      max_tokens:1400,
      tools:[{type:'web_search_20250305',name:'web_search',max_uses:4}],
      messages:[{role:'user',content:prompt}],
    });
    return {
      summary:extractTextBlocks(data)||'Web search completed.',
      sources:extractWebSources(data),
      checkedAt:new Date().toISOString(),
      model:CLAUDE_MODEL,
    };
  }catch(e){
    return {summary:'',sources:[],checkedAt:new Date().toISOString(),model:CLAUDE_MODEL,error:e.message};
  }
}

// Step 2: classify lines using built-in rules + live rule summary.
async function classifyLinesWithAI(lines,stateAbbr,apiKey,onProgress,onStatus,liveRules){
  const program=getStateProgram(stateAbbr);
  const categoryNames=Object.keys(program.cats);
  const categoryList=categoryNames.map(name=>`${name} (${program.cats[name].q?'QUALIFIES':'DOES NOT QUALIFY'})`).join('\n');
  const BATCH=15;
  const results={};

  const liveRulesSection=liveRules&&liveRules.summary
    ? `\nLATEST RULES CHECK (${new Date(liveRules.checkedAt||Date.now()).toLocaleDateString()}):\n${liveRules.summary}\n\nIf the latest rules summary conflicts with the built-in rules, use the latest rules summary.`
    : '';

  for(let i=0;i<lines.length;i+=BATCH){
    const batch=lines.slice(i,i+BATCH);
    if(onStatus)onStatus(`Classifying lines ${i+1}–${Math.min(i+BATCH,lines.length)} of ${lines.length}…`);

    const lineDescriptions=batch.map((l,idx)=>`Line ${idx+1}: source=${l.src}; vendor_or_employee="${(l.vendor||l.employee||'').replace(/"/g,"'")}"; memo="${(l.memo||l.acct_name||'').replace(/"/g,"'")}"; department="${(l.dept||'').replace(/"/g,"'")}"; account="${(l.acct_name||l.acct||'').replace(/"/g,"'")}"; residency="${(l.residency||'').replace(/"/g,"'")}"; amount=${Number(l.amount||0).toFixed(2)}`).join('\n');

    const prompt=`You are a film production accountant specializing in ${program.name} incentive applications.${liveRulesSection}

BUILT-IN ${stateAbbr} RULES:
${program.aiPromptRules}

AVAILABLE CATEGORIES:
${categoryList}

Classify each line as one of:
- QE = qualifying expense
- NQ = non-qualifying expense
- NR = not required / not applicable

Return ONLY a JSON object shaped exactly like this, with one entry per input line:
{"results":[{"line":1,"tag":"QE","confidence":"high","category":"<category name or empty string>","reason":"<short reason>"}]}
"tag" must be QE, NQ, or NR. "confidence" must be high, medium, or low. Keep reasons under 12 words. Use low confidence if the information is incomplete or ambiguous. Use an empty string for category if none fits. Do not wrap the JSON in markdown fences or add any other text.

Lines:
${lineDescriptions}`;

    try{
      const data=await requestClaude(apiKey,{
        model:CLAUDE_MODEL,
        max_tokens:2000,
        messages:[{role:'user',content:prompt}],
      });

      const rawText=extractTextBlocks(data);
      const tryParse=(s)=>{
        try{return JSON.parse(s);}catch{
          const fixed=s.replace(/```json|```/g,'').trim().replace(/,\s*([\]}])/g,'$1');
          return JSON.parse(fixed);
        }
      };
      let parsed=null;
      const objStart=rawText.indexOf('{');const objEnd=rawText.lastIndexOf('}');
      const arrStart=rawText.indexOf('[');const arrEnd=rawText.lastIndexOf(']');
      if(objStart!==-1&&objEnd!==-1){try{const cand=tryParse(rawText.slice(objStart,objEnd+1));if(cand&&Array.isArray(cand.results))parsed=cand;}catch{}}
      if(!parsed&&arrStart!==-1&&arrEnd!==-1){try{parsed={results:tryParse(rawText.slice(arrStart,arrEnd+1))};}catch{}}

      const items=Array.isArray(parsed?.results)?parsed.results:[];

      items.forEach((r,idx)=>{
        if(!r||typeof r!=='object')return;
        const rowIndex=typeof r.line==='number'?r.line-1:idx;
        const line=batch[rowIndex]||batch[idx];
        if(!line)return;
        const tag=['QE','NQ','NR'].includes(r.tag)?r.tag:null;
        const conf=['high','medium','low'].includes(r.confidence)?r.confidence:'low';
        const category=categoryNames.includes(r.category)?r.category:'';
        results[line.id]={
          ai_tag:tag==='NR'?'Not Required':tag,
          ai_confidence:conf,
          ai_reason:typeof r.reason==='string'?r.reason.slice(0,96):'',
          ai_cat:category,
          ai_failed:false,
        };
      });

      batch.forEach(line=>{
        if(!results[line.id]){
          results[line.id]={
            ai_tag:null,
            ai_confidence:'low',
            ai_reason:'No structured result returned',
            ai_cat:'',
            ai_failed:true,
          };
        }
      });
    }catch(e){
      batch.forEach(line=>{
        results[line.id]={
          ai_tag:null,
          ai_confidence:'low',
          ai_reason:'Classification failed: '+e.message.slice(0,72),
          ai_cat:'',
          ai_failed:true,
        };
      });
    }

    if(onProgress)onProgress(Math.min(100,Math.round(((i+BATCH)/lines.length)*100)));
    if(i+BATCH<lines.length)await new Promise(r=>setTimeout(r,220));
  }

  return results;
}

// ─── STEP 1: UPLOAD ───────────────────────────────────────
function UploadStep({project,onUpdate}){
  const [dragging,setDragging]=useState(null);
  const [parsing,setParsing]=useState(false);
  const [pendingType,setPendingType]=useState('GL');
  const [message,setMessage]=useState('');
  const [error,setError]=useState('');
  const fileInputRef=useRef(null);
  const uploads=project.uploads||[];

  async function handleFile(file,type){
    if(!file)return;
    if(uploads.length>=20){setError('Maximum 20 uploads per project reached.');return;}
    setParsing(true);setError('');setMessage('');
    try{
      const {headers,rows}=await parseFile(file);
      const upload={id:uid(),name:file.name,type,date:new Date().toISOString(),headers,rows,size:file.size};
      onUpdate({...project,uploads:[...uploads,upload]});
      setMessage(`${file.name} imported successfully — ${rows.length.toLocaleString()} rows found.`);
    }catch(e){
      setError('Could not parse file: '+e.message);
    }
    setParsing(false);
  }

  function handleDrop(e,type){e.preventDefault();setDragging(null);handleFile(e.dataTransfer.files[0],type);}

  function removeUpload(id){
    const remaining=uploads.filter(u=>u.id!==id);
    const remainingIds=new Set(remaining.map(u=>u.id));
    const cleanedLines=(project.lines||[]).filter(l=>{
      const uploadId=l.id.split('_').slice(1,-1).join('_');
      return remainingIds.has(uploadId);
    });
    const cleanedVendors={};
    Object.entries(project.vendors||{}).forEach(([name,v])=>{if(cleanedLines.some(l=>l.vendor===name))cleanedVendors[name]=v;});
    const cleanedMappings={};
    Object.entries(project.mappings||{}).forEach(([k,v])=>{
      if(k==='GL'||k==='Payroll')cleanedMappings[k]=v;
      else if(remainingIds.has(k))cleanedMappings[k]=v;
    });
    const stalledExports=(project.exports||[]).map(e=>({...e,stale:true}));
    onUpdate({...project,uploads:remaining,lines:cleanedLines,vendors:cleanedVendors,mappings:cleanedMappings,exports:stalledExports});
    setMessage('Upload removed. Existing exports were marked stale.');
  }

  function downloadTemplate(type){
    const rows=type==='GL'
      ? [['Date','Account Number','Account Name','Vendor','Memo','Amount','Department','Qualification Tag'],['2026-01-05','6100','Equipment Rentals','CameraCo','Lens package week 1','12500','Camera','QE']]
      : [['Employee Name','Payroll Amount','Department','Date','Residency Status','Qualification Tag'],['Jamie Rivera','2850','Grip','2026-01-12','NJ Resident','QE']];
    const csv=rows.map(r=>r.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download=`film_tax_${type.toLowerCase()}_template.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }

  const prog=getStateProgram(project.state);
  const FILE_TYPES=[
    {type:'GL',label:'General ledger',icon:'📒',color:'navy',desc:'Vendor, memo, account, amount, department'},
    {type:'Payroll',label:'Payroll',icon:'👥',color:'teal',desc:'Employee, amount, date, department, residency'},
    {type:'Trial Balance',label:'Trial balance',icon:'⚖️',color:'gray',desc:'Optional reference file for tie-out work'},
  ];

  return (
    <div style={{flex:1,padding:32,maxWidth:920}}>
      <PageHeader
        eyebrow="Step 1 of 4"
        title="Upload files"
        subtitle={`Bring in your GL and payroll exports for ${prog.name}. The app stores full file data in browser storage so you can come back and remap later without losing the imported rows.`}
        badge={<Chip color="navy">{prog.abbr} program</Chip>}
      />

      <div className="grid-auto-wide" style={{marginBottom:18}}>
        <Card className="hero-panel" style={{padding:'18px 20px',background:'linear-gradient(135deg,rgba(21,59,99,0.95),rgba(15,154,139,0.92))',color:'#fff'}}>
          <div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.10em',opacity:0.7,fontWeight:700,marginBottom:8}}>Program snapshot</div>
          <div style={{display:'grid',gap:8}}>
            <div><strong>Rate:</strong> {prog.rate} · {prog.rateNote}</div>
            <div><strong>Minimum spend:</strong> {fmt(prog.minSpend)}</div>
            <div><strong>Above-the-line:</strong> {prog.atl?'Can qualify in this state':'Does not qualify in this state'}</div>
          </div>
        </Card>
        <Card style={{padding:'18px 20px'}}>
          <div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.10em',color:'var(--text-3)',fontWeight:700,marginBottom:8}}>Helpful files</div>
          <div style={{display:'grid',gap:9,fontSize:13,color:'var(--text-2)'}}>
            <div>• General ledger export for production spend</div>
            <div>• Payroll register with residency where possible</div>
            <div>• Optional trial balance for tie-out work</div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}>
            <Btn variant="secondary" small onClick={()=>downloadTemplate('GL')}>GL template</Btn>
            <Btn variant="secondary" small onClick={()=>downloadTemplate('Payroll')}>Payroll template</Btn>
          </div>
        </Card>
      </div>

      <div className="grid-auto-wide" style={{marginBottom:22}}>
        {FILE_TYPES.map(({type,label,icon,desc})=>(
          <div key={type} onDragOver={e=>{e.preventDefault();setDragging(type);}} onDragLeave={()=>setDragging(null)} onDrop={e=>handleDrop(e,type)} onClick={()=>{setPendingType(type);fileInputRef.current.click();}}
            style={{border:`2px dashed ${dragging===type?'var(--teal)':'var(--border-strong)'}`,borderRadius:'20px',padding:'24px 18px',textAlign:'center',cursor:'pointer',background:dragging===type?'var(--teal-bg)':'var(--bg-elevated)',boxShadow:'var(--shadow-sm)',transition:'all 0.15s'}}>
            <div style={{fontSize:28,marginBottom:10}}>{icon}</div>
            <div style={{fontWeight:900,fontSize:14,marginBottom:4,color:'var(--navy)'}}>{label}</div>
            <div style={{color:'var(--text-3)',fontSize:12,lineHeight:1.5,marginBottom:8}}>{desc}</div>
            <Chip color={type==='GL'?'navy':type==='Payroll'?'teal':'gray'}>{type==='Trial Balance'?'Optional':'Upload'}</Chip>
          </div>
        ))}
      </div>

      <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls,.tsv,.txt" style={{display:'none'}} onChange={e=>{handleFile(e.target.files[0],pendingType);e.target.value='';}}/>
      {parsing&&<Alert type="info" style={{marginBottom:14}}>Parsing file… depending on size, this can take a few seconds.</Alert>}
      {message&&<Alert type="success" style={{marginBottom:14}}>{message}</Alert>}
      {error&&<Alert type="error" style={{marginBottom:14}}>{error}</Alert>}

      {uploads.length>0?(
        <Card style={{marginBottom:16}}>
          <SectionHead label={`Uploaded files (${uploads.length} / 20)`} sub="You can remove and replace files at any time. Removing a file also marks prior exports as stale."/>
          <div>
            {uploads.map(u=>{
              const rowCount=(u.rows||[]).length;
              return (
                <div key={u.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
                  <span style={{fontSize:22}}>📄</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.name}</div>
                    <div style={{color:'var(--text-3)',fontSize:11,marginTop:2}}>{rowCount.toLocaleString()} rows · {(u.headers||[]).length} columns · added {formatDate(u.date)}</div>
                  </div>
                  <Chip color={u.type==='GL'?'navy':u.type==='Payroll'?'teal':'gray'}>{u.type}</Chip>
                  <Btn variant="danger" small onClick={()=>removeUpload(u.id)}>Remove</Btn>
                </div>
              );
            })}
          </div>
        </Card>
      ):(
        <EmptyState icon="📤" title="Nothing uploaded yet" text="Start with your GL and payroll files. The mapping step becomes much easier once the files are in." />
      )}

      <Alert type="info"><strong>Tip:</strong> If your exports already include a qualification field such as QE / NQ, map that column in Step 2. The AI will only work on the lines that remain untagged.</Alert>
    </div>
  );
}

// ─── STEP 2: MAP ──────────────────────────────────────────
const GL_FIELDS=[
  {k:'date',l:'Date',req:true},{k:'account_number',l:'Account Number'},{k:'account_name',l:'Account Name'},
  {k:'vendor',l:'Vendor / Payee'},{k:'memo',l:'Memo / Description'},
  {k:'amount',l:'Amount (net)',note:'Use this OR map Debit + Credit below'},{k:'debit',l:'Debit'},{k:'credit',l:'Credit'},
  {k:'department',l:'Department / Cost Center'},{k:'qual_tag',l:'Qualification Tag',pref:true,note:'If your export already contains QE/NQ values, map that column'},
];
const PAY_FIELDS=[
  {k:'employee_name',l:'Employee Name',req:true},{k:'amount',l:'Payroll Amount',req:true},
  {k:'department',l:'Department'},{k:'date',l:'Date'},
  {k:'qual_tag',l:'Qualification Tag',pref:true,note:'If your export already contains QE/NQ values, map that column'},
  {k:'residency',l:'Residency Status',note:'Helpful for states that require resident labor tests'},
];
const AUTO_HINTS={
  GL:{date:['date','transaction date','tran date','posting date','post date'],account_number:['account number','account no','account #','acct no','acct #','account_number'],account_name:['account name','account description','acct name'],vendor:['vendor','payee','supplier','vendor name','payee name'],memo:['memo','description','desc','narration','notes','reference'],amount:['amount','net amount','net','total','transaction amount'],debit:['debit','dr','debit amount'],credit:['credit','cr','credit amount'],department:['department','dept','cost center','division','cost_center'],qual_tag:['qual','qualification','qe/nq','qualifying','qual tag','qualify','qual_tag','q tag']},
  Payroll:{employee_name:['employee','employee name','name','full name','emp name','worker'],amount:['amount','gross','pay','salary','payroll amount','total pay','wages','gross pay'],department:['department','dept','division'],date:['date','pay date','period','period end','check date'],qual_tag:['qual','qualification','qe/nq','qualifying','qual tag','qualify','qual_tag'],residency:['residency','resident','state','residence','tax state','home state']},
};

function MapStep({project,onUpdate}){
  const [tab,setTab]=useState('GL');
  const [maps,setMaps]=useState(project.mappings||{GL:{},Payroll:{}});
  const [processed,setProcessed]=useState(false);
  const [message,setMessage]=useState('');
  const [error,setError]=useState('');
  const glUploads=(project.uploads||[]).filter(u=>u.type==='GL');
  const payUploads=(project.uploads||[]).filter(u=>u.type==='Payroll');
  const activeUploads=tab==='GL'?glUploads:payUploads;
  const [activeUploadIdx,setActiveUploadIdx]=useState(0);

  useEffect(()=>{
    setActiveUploadIdx(idx=>activeUploads.length===0?0:Math.min(idx,activeUploads.length-1));
  },[tab,activeUploads.length]);

  const activeUpload=activeUploads[activeUploadIdx];
  const cols=activeUpload?.headers||[];
  const fields=tab==='GL'?GL_FIELDS:PAY_FIELDS;
  const mapKey=activeUpload?.id||tab;
  const curMap=maps[mapKey]||(maps[tab]||{});
  const previewRows=(activeUpload?.rows||[]).slice(0,5);

  function autoMap(){
    const hints=AUTO_HINTS[tab]||{};
    const nm={};
    const lc=s=>(s||'').toLowerCase().trim();
    Object.entries(hints).forEach(([field,keywords])=>{
      let match=null;
      for(const kw of keywords){
        match=cols.find(col=>lc(col)===kw);
        if(match)break;
      }
      if(!match){
        for(const kw of keywords){
          match=cols.find(col=>lc(col).includes(kw));
          if(match)break;
        }
      }
      if(match)nm[field]=match;
    });
    setMaps(m=>({...m,[mapKey]:{...(m[mapKey]||{}),...nm}}));
    setMessage('Best-guess mappings applied. Review them before processing.');
  }

  function getUploadIssues(type,upload,map){
    const issues=[];
    if(type==='GL'){
      if(!map.date)issues.push('Map Date');
      if(!(map.amount||(map.debit&&map.credit)))issues.push('Map Amount or both Debit + Credit');
    }else if(type==='Payroll'){
      if(!map.employee_name)issues.push('Map Employee Name');
      if(!map.amount)issues.push('Map Payroll Amount');
    }
    if(!upload?.rows?.length)issues.push('File has no data rows');
    return issues;
  }

  function processLines(){
    const mappingIssues=[];
    glUploads.forEach(up=>{
      const m=maps[up.id]||maps.GL||{};
      const issues=getUploadIssues('GL',up,m);
      if(issues.length)mappingIssues.push(`${up.name}: ${issues.join(', ')}`);
    });
    payUploads.forEach(up=>{
      const m=maps[up.id]||maps.Payroll||{};
      const issues=getUploadIssues('Payroll',up,m);
      if(issues.length)mappingIssues.push(`${up.name}: ${issues.join(', ')}`);
    });

    if(mappingIssues.length){
      setError('Fix these mappings before processing: '+mappingIssues.join(' · '));
      setMessage('');
      return;
    }

    const lines=[];
    glUploads.forEach(up=>{
      const m=maps[up.id]||maps.GL||{};
      (up.rows||[]).forEach((row,i)=>{
        const rawTag=(row[m.qual_tag]||'').toString().trim();
        const qs=normalizeQualTag(rawTag);
        const qs_src=qs!=='Untagged'?'Imported from source file':'Pending AI classification';
        const amount=m.amount&&row[m.amount]!==undefined&&row[m.amount]!==''
          ? parseMoney(row[m.amount])
          : (parseMoney(row[m.debit]||0)-parseMoney(row[m.credit]||0));
        const warns=[];
        if(!String(row[m.vendor]||'').trim())warns.push('Missing Vendor');
        if(!String(row[m.memo]||'').trim()&&!String(row[m.account_name]||'').trim())warns.push('Missing Memo / Account Name');
        if(!String(row[m.date]||'').trim())warns.push('Missing Date');
        if(amount<0)warns.push('Negative Amount');
        if(amount===0)warns.push('Zero Amount');
        if(qs==='Untagged')warns.push('Pending AI classification');
        lines.push({
          id:`gl_${up.id}_${i}`,
          src:'GL',
          date:(row[m.date]||'').toString(),
          acct:(row[m.account_number]||'').toString(),
          acct_name:(row[m.account_name]||'').toString(),
          vendor:(row[m.vendor]||'').toString(),
          memo:(row[m.memo]||'').toString(),
          amount,
          dept:(row[m.department]||'').toString(),
          qs,
          qs_src,
          cat:'',
          warnings:warns,
          raw_qual:rawTag,
          ai_tag:null,
          ai_confidence:null,
          ai_reason:null,
          ai_cat:null,
          ai_failed:false,
        });
      });
    });
    payUploads.forEach(up=>{
      const m=maps[up.id]||maps.Payroll||{};
      (up.rows||[]).forEach((row,i)=>{
        const rawTag=(row[m.qual_tag]||'').toString().trim();
        const qs=normalizeQualTag(rawTag);
        const qs_src=qs!=='Untagged'?'Imported from source file':'Pending AI classification';
        const amount=parseMoney(row[m.amount]||0);
        const residency=(row[m.residency]||'').toString();
        const employee=(row[m.employee_name]||'').toString();
        const warns=[];
        if(!employee)warns.push('Missing Employee Name');
        if(!residency)warns.push('Missing Employee Residency');
        if(!String(row[m.date]||'').trim())warns.push('Missing Date');
        if(qs==='Untagged')warns.push('Pending AI classification');
        if(amount<0)warns.push('Negative Amount');
        if(amount===0)warns.push('Zero Amount');
        lines.push({
          id:`pay_${up.id}_${i}`,
          src:'Payroll',
          date:(row[m.date]||'').toString(),
          employee,
          amount,
          dept:(row[m.department]||'').toString(),
          residency,
          qs,
          qs_src,
          cat:'',
          warnings:warns,
          raw_qual:rawTag,
          ai_tag:null,
          ai_confidence:null,
          ai_reason:null,
          ai_cat:null,
          ai_failed:false,
        });
      });
    });
    const vendors={};
    lines.filter(l=>l.src==='GL'&&l.vendor).forEach(l=>{
      if(!vendors[l.vendor]){
        const existing=(project.vendors||{})[l.vendor];
        vendors[l.vendor]={name:l.vendor,status:existing?.status||'',id:existing?.id||uid()};
      }
    });
    onUpdate({...project,mappings:maps,lines,vendors});
    setProcessed(true);
    setError('');
    setMessage(`${lines.length.toLocaleString()} lines processed successfully. Review them in Step 3.`);
  }

  return (
    <div style={{flex:1,padding:32,maxWidth:980}}>
      <PageHeader
        eyebrow="Step 2 of 4"
        title="Map columns"
        subtitle="Map each uploaded file once. The app saves mappings per file so mixed exports do not stomp on each other."
        badge={<Chip color="teal">{((project.uploads||[]).length)} uploads</Chip>}
      />

      <div style={{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
        {['GL','Payroll'].map(t=><Btn key={t} variant={tab===t?'teal':'secondary'} onClick={()=>setTab(t)} small>{t==='GL'?'General Ledger':'Payroll'}</Btn>)}
      </div>

      {error&&<Alert type="error" style={{marginBottom:14}}>{error}</Alert>}
      {message&&<Alert type="success" style={{marginBottom:14}}>{message}</Alert>}

      {activeUploads.length===0?(
        <EmptyState icon="🧭" title={`No ${tab} files yet`} text={`Upload at least one ${tab==='GL'?'general ledger':'payroll'} file in Step 1 to start mapping columns.`} />
      ):(
        <div style={{display:'grid',gridTemplateColumns:'minmax(0,1.3fr) minmax(320px,0.9fr)',gap:16,alignItems:'start'}}>
          <Card>
            <SectionHead
              label={`${tab==='GL'?'General Ledger':'Payroll'} mapping`}
              sub={activeUpload?.name||''}
              action={<div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                {activeUploads.length>1&&<select value={activeUploadIdx} onChange={e=>setActiveUploadIdx(Number(e.target.value))} style={{background:'var(--bg-soft)',border:'1px solid var(--border-strong)',borderRadius:'10px',padding:'6px 10px'}}>{activeUploads.map((u,i)=><option key={u.id} value={i}>{u.name}</option>)}</select>}
                <Btn variant="secondary" small onClick={autoMap}>Auto-detect</Btn>
              </div>}
            />
            <div style={{padding:'16px 18px'}}>
              <div style={{display:'grid',gap:12}}>
                {fields.map(f=>{
                  const mapped=!!curMap[f.k];
                  return (
                    <div key={f.k} style={{display:'grid',gridTemplateColumns:'230px 1fr',alignItems:'start',gap:12}}>
                      <div style={{paddingTop:7}}>
                        <div style={{fontSize:13,color:'var(--text)',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                          <span style={{fontWeight:700}}>{f.l}</span>
                          {f.req&&<Chip color="red" small>Required</Chip>}
                          {f.pref&&<Chip color="amber" small>Preferred</Chip>}
                        </div>
                        {f.note&&<div style={{fontSize:11,color:'var(--text-3)',marginTop:4,lineHeight:1.45}}>{f.note}</div>}
                      </div>
                      <select value={curMap[f.k]||''} onChange={e=>setMaps(m=>({...m,[mapKey]:{...(m[mapKey]||{}),[f.k]:e.target.value}}))} style={{background:'var(--bg-soft)',border:`1px solid ${mapped?'rgba(15,154,139,0.35)':'var(--border-strong)'}`,borderRadius:'12px',padding:'9px 11px',color:mapped?'var(--text)':'var(--text-3)',marginTop:2}}>
                        <option value="">— not mapped —</option>
                        {cols.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                  );
                })}
              </div>
            </div>
          </Card>

          <div style={{display:'grid',gap:16}}>
            <Card>
              <SectionHead label="Readiness check"/>
              <div style={{padding:'16px 18px',display:'grid',gap:10,fontSize:13}}>
                {getUploadIssues(tab,activeUpload,curMap).length===0
                  ? <Alert type="success">This file has the required mappings and is ready to process.</Alert>
                  : <Alert type="warning">{getUploadIssues(tab,activeUpload,curMap).join(' · ')}</Alert>}
                <div style={{display:'flex',justifyContent:'space-between',color:'var(--text-2)'}}><span>Columns detected</span><strong>{cols.length}</strong></div>
                <div style={{display:'flex',justifyContent:'space-between',color:'var(--text-2)'}}><span>Preview rows</span><strong>{(activeUpload?.rows||[]).length.toLocaleString()}</strong></div>
                <div style={{display:'flex',justifyContent:'space-between',color:'var(--text-2)'}}><span>Mapped fields</span><strong>{Object.values(curMap).filter(Boolean).length}</strong></div>
              </div>
            </Card>

            <Card>
              <SectionHead label="Source preview" sub="First 5 rows from the selected file"/>
              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead>
                    <tr style={{background:'var(--bg-soft)',borderBottom:'1px solid var(--border)'}}>
                      {cols.slice(0,6).map(col=><th key={col} style={{padding:'8px 10px',textAlign:'left',fontSize:10,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em'}}>{col}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {previewRows.length>0?previewRows.map((row,idx)=>(
                      <tr key={idx} style={{borderBottom:'1px solid var(--border)'}}>
                        {cols.slice(0,6).map(col=><td key={col} style={{padding:'8px 10px',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{String(row[col]??'')}</td>)}
                      </tr>
                    )):(<tr><td style={{padding:'12px 10px',color:'var(--text-3)'}} colSpan={6}>No preview rows available.</td></tr>)}
                  </tbody>
                </table>
              </div>
            </Card>
          </div>
        </div>
      )}

      <div style={{display:'flex',alignItems:'center',gap:12,marginTop:18,flexWrap:'wrap'}}>
        <Btn variant="teal" onClick={processLines} disabled={glUploads.length===0&&payUploads.length===0}>Apply mappings & process lines</Btn>
        {processed&&<Chip color="green">Ready for Step 3</Chip>}
      </div>
    </div>
  );
}

// ─── STEP 3: REVIEW ───────────────────────────────────────
const PER_PAGE=100;

function ReviewStep({project,onUpdate}){
  const [tab,setTab]=useState('summary');
  const [filter,setFilter]=useState({qs:'all',src:'all',dept:'all',warn:'all',cat:'all',aiConf:'all',query:''});
  const [page,setPage]=useState(0);
  const [aiRunning,setAiRunning]=useState(false);
  const [aiProgress,setAiProgress]=useState(0);
  const [aiStatus,setAiStatus]=useState('');
  const [aiError,setAiError]=useState('');
  const [liveRules,setLiveRules]=useState(project.liveRules||null);
  const lines=project.lines||[];
  const vendors=project.vendors||{};
  const prog=getStateProgram(project.state);
  const stateCats=getStateCats(project.state);

  const totals=useMemo(()=>{
    const t={QE:0,NQ:0,Untagged:0,'Not Required':0,gl:0,pay:0,total:0,warns:0,qeCount:0,nqCount:0,unCount:0,nrCount:0,aiHigh:0,aiMed:0,aiLow:0,aiPending:0};
    lines.forEach(l=>{
      const a=l.amount||0;t[l.qs]=(t[l.qs]||0)+a;
      if(l.qs==='QE')t.qeCount++;if(l.qs==='NQ')t.nqCount++;if(l.qs==='Untagged')t.unCount++;if(l.qs==='Not Required')t.nrCount++;
      if(l.src==='GL')t.gl+=a;if(l.src==='Payroll')t.pay+=a;t.total+=a;t.warns+=(l.warnings?.length||0);
      if(l.ai_tag&&l.qs==='Untagged'){if(l.ai_confidence==='high')t.aiHigh++;else if(l.ai_confidence==='medium')t.aiMed++;else if(l.ai_confidence==='low')t.aiLow++;}
      if(!l.ai_tag&&l.qs==='Untagged')t.aiPending++;
    });
    return t;
  },[lines]);

  const warnBreakdown=useMemo(()=>{const b={};lines.forEach(l=>(l.warnings||[]).forEach(w=>{b[w]=(b[w]||0)+1;}));return b;},[lines]);
  const catTotals=useMemo(()=>{const b={};lines.forEach(l=>{if(!l.cat)return;if(!b[l.cat])b[l.cat]={total:0,count:0};b[l.cat].total+=(l.amount||0);b[l.cat].count++;});return b;},[lines]);
  const depts=[...new Set(lines.map(l=>l.dept).filter(Boolean))].sort();
  const aiFailedCount=lines.filter(l=>l.qs==='Untagged'&&l.ai_failed).length;

  const filtered=useMemo(()=>lines.filter(l=>{
    const haystack=[l.vendor,l.employee,l.memo,l.acct_name,l.dept,l.acct,l.residency].join(' ').toLowerCase();
    if(filter.query&& !haystack.includes(filter.query.toLowerCase()))return false;
    if(filter.qs!=='all'&&l.qs!==filter.qs)return false;
    if(filter.src!=='all'&&l.src!==filter.src)return false;
    if(filter.dept!=='all'&&l.dept!==filter.dept)return false;
    if(filter.warn==='yes'&&(!l.warnings||l.warnings.length===0))return false;
    if(filter.cat==='__none'&&l.cat)return false;
    if(filter.cat&&filter.cat!=='all'&&filter.cat!=='__none'&&l.cat!==filter.cat)return false;
    if(filter.aiConf==='pending'&&l.ai_tag)return false;
    if(filter.aiConf==='high'&&l.ai_confidence!=='high')return false;
    if(filter.aiConf==='medium'&&l.ai_confidence!=='medium')return false;
    if(filter.aiConf==='low'&&l.ai_confidence!=='low')return false;
    return true;
  }),[lines,filter]);

  function updateLine(id,patch){onUpdate({...project,lines:lines.map(l=>l.id===id?{...l,...patch}:l)});}
  function updateVendor(name,patch){onUpdate({...project,vendors:{...vendors,[name]:{...(vendors[name]||{}),name,...patch}}});}

  async function runAI(){
    const apiKey=loadApiKey();
    if(!apiKey){setAiError('No API key set. Go to AI Settings and enter your Anthropic API key.');return;}
    const untagged=lines.filter(l=>l.qs==='Untagged');
    if(!untagged.length){setAiError('No untagged lines to classify.');return;}
    setAiRunning(true);setAiError('');setAiProgress(0);setAiStatus('');setLiveRules(null);
    try{
      // Step 1: fetch live rules
      const fetched = await fetchLiveRules(project.state, apiKey, setAiStatus);
      setLiveRules(fetched);
      if(fetched.error){
        setAiStatus('Web search unavailable — using built-in rules. Classifying lines…');
      } else {
        setAiStatus('Live rules retrieved. Classifying lines…');
      }
      // Step 2: classify with live rules injected
      const results=await classifyLinesWithAI(
        untagged, project.state, apiKey,
        (pct)=>setAiProgress(pct),
        setAiStatus,
        fetched
      );
      const updated=lines.map(l=>{
        if(results[l.id])return {...l,...results[l.id]};
        return l;
      });
      onUpdate({...project,lines:updated,liveRules:fetched,lastAiRunAt:new Date().toISOString()});
      setAiStatus('Done.');
    }catch(e){setAiError('AI classification failed: '+e.message);}
    setAiRunning(false);setAiProgress(100);
  }

  function approveHighConfidence(){
    const updated=lines.map(l=>{
      if(l.ai_tag&&l.ai_confidence==='high'&&l.qs==='Untagged'){
        return {
          ...l,
          qs:l.ai_tag,
          qs_src:'AI classified (approved)',
          cat:l.ai_cat||l.cat,
          warnings:(l.warnings||[]).filter(w=>w!=='Pending AI classification'),
        };
      }
      return l;
    });
    onUpdate({...project,lines:updated});
  }

  function applyAISuggestion(id){
    const l=lines.find(x=>x.id===id);
    if(!l||!l.ai_tag)return;
    updateLine(id,{qs:l.ai_tag,qs_src:'AI classified (approved)',cat:l.ai_cat||l.cat,warnings:(l.warnings||[]).filter(w=>w!=='Pending AI classification')});
  }

  const TABS=[{id:'summary',l:'Summary'},{id:'ai',l:`AI Review${totals.aiHigh+totals.aiMed+totals.aiLow>0?` (${totals.aiHigh+totals.aiMed+totals.aiLow})`:''}`,},{id:'lines',l:`All Lines (${lines.length.toLocaleString()})`},{id:'vendors',l:`Vendors (${Object.keys(vendors).length})`},{id:'warnings',l:`Warnings (${totals.warns})`}];

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
      <div style={{padding:'24px 32px 0',background:'var(--bg2)',borderBottom:'0.5px solid var(--border)',flexShrink:0}}>
        <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:4}}>Step 3 of 4</div>
        <h2 style={{fontSize:20,fontWeight:800,color:'var(--navy)',marginBottom:14}}>Review Lines — <span style={{color:'var(--teal)',fontSize:16}}>{prog.name}</span></h2>
        <div style={{display:'flex',gap:0}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'8px 16px',background:'none',border:'none',borderBottom:tab===t.id?'2px solid var(--teal)':'2px solid transparent',color:tab===t.id?'var(--teal)':'var(--text2)',fontWeight:tab===t.id?600:400,fontSize:13,cursor:'pointer',marginBottom:-1}}>{t.l}</button>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflow:'auto',padding:24}}>

        {/* SUMMARY TAB */}
        {tab==='summary'&&(
          <div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}}>
              <StatTile label="Qualifying (QE)" value={fmt(totals.QE)} color="var(--teal)" sub={`${totals.qeCount} lines`}/>
              <StatTile label="Non-Qualifying (NQ)" value={fmt(totals.NQ)} color="var(--red)" sub={`${totals.nqCount} lines`}/>
              <StatTile label="Untagged" value={fmt(totals.Untagged)} color="var(--amber)" sub={`${totals.unCount} lines`}/>
              <StatTile label="Not Required" value={fmt(totals['Not Required'])} color="var(--text2)" sub={`${totals.nrCount} lines`}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
              <StatTile label="GL Total" value={fmt(totals.gl)}/>
              <StatTile label="Payroll Total" value={fmt(totals.pay)}/>
              <StatTile label="Grand Total" value={fmt(totals.total)}/>
            </div>
            {totals.warns>0&&<div style={{marginBottom:16}}><Alert type="warning">{totals.warns} validation warnings. Review the Warnings tab before export.</Alert></div>}
            {totals.unCount>0&&(
              <div style={{marginBottom:16}}><Alert type="info">{totals.unCount} untagged lines ({fmt(totals.Untagged)}). Go to the AI Review tab to run automatic classification.</Alert></div>
            )}
            {Object.keys(catTotals).length>0&&(
              <Card>
                <SectionHead label={`${prog.name} Category Breakdown`}/>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                    <thead><tr style={{background:'var(--bg3)',borderBottom:'0.5px solid var(--border)'}}>{['Category','Qualified?','Amount','Lines'].map(h=><th key={h} style={{padding:'8px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</th>)}</tr></thead>
                    <tbody>
                      {Object.entries(catTotals).sort((a,b)=>b[1].total-a[1].total).map(([cat,v])=>(
                        <tr key={cat} style={{borderBottom:'0.5px solid var(--border)'}}>
                          <td style={{padding:'9px 14px',fontWeight:500}}>{cat}</td>
                          <td style={{padding:'9px 14px'}}><Chip color={stateCats[cat]?.q?'teal':'red'}>{stateCats[cat]?.q?'Qualified':'Non-Qualified'}</Chip></td>
                          <td style={{padding:'9px 14px',fontVariantNumeric:'tabular-nums',fontWeight:600}}>{fmt(v.total)}</td>
                          <td style={{padding:'9px 14px',color:'var(--text2)'}}>{v.count}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            )}
          </div>
        )}

        {/* AI REVIEW TAB */}
        {tab==='ai'&&(
          <div>
            <Card style={{marginBottom:16}}>
              <SectionHead label="AI Auto-Classification"/>
              <div style={{padding:'16px 20px'}}>
                <p style={{color:'var(--text2)',fontSize:13,marginBottom:14}}>Claude will analyze each untagged line using <strong>{prog.name}</strong> qualification rules and suggest QE/NQ tags with confidence scores.</p>
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:16}}>
                  <StatTile label="Untagged Lines" value={totals.unCount} color="var(--amber)"/>
                  <StatTile label="AI High Confidence" value={totals.aiHigh} color="var(--green)"/>
                  <StatTile label="AI Medium Conf." value={totals.aiMed} color="var(--amber)"/>
                  <StatTile label="AI Low Conf." value={totals.aiLow} color="var(--red)"/>
                </div>
                {aiError&&<div style={{marginBottom:12}}><Alert type="error">{aiError}</Alert></div>}
                {aiRunning&&(
                  <div style={{marginBottom:12}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text2)',marginBottom:6}}>
                      <span className="ai-pulse">{aiStatus||'Working…'}</span>
                      <span>{aiProgress}%</span>
                    </div>
                    <div style={{height:4,background:'var(--bg4)',borderRadius:2,overflow:'hidden'}}><div style={{height:'100%',background:'var(--teal)',borderRadius:2,width:aiProgress+'%',transition:'width 0.3s'}}/></div>
                  </div>
                )}
                {/* Live rules findings panel */}
                {liveRules&&!aiRunning&&(

                      <span style={{fontSize:13,fontWeight:600,color:'var(--navy)'}}>🌐 Live Rule Check — {prog.name}</span>
                      <Chip color={liveRules.error?'amber':'green'} small>{liveRules.error?'Fallback to built-in':'Web search complete'}</Chip>
                      <span style={{marginLeft:'auto',fontSize:10,color:'var(--text3)'}}>{new Date().toLocaleDateString()}</span>
                    </div>
                    {liveRules.error&&<div style={{fontSize:12,color:'var(--amber)',marginBottom:6}}>Web search unavailable ({liveRules.error.slice(0,60)}). Built-in rules were used — results are still valid.</div>}
                    {liveRules.summary&&<div style={{fontSize:12,color:'var(--text2)',lineHeight:1.6,maxHeight:120,overflow:'auto',whiteSpace:'pre-wrap'}}>{liveRules.summary.slice(0,600)}{liveRules.summary.length>600?'…':''}</div>}
                    {liveRules.sources&&liveRules.sources.length>0&&(
                      <div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
                        {liveRules.sources.map((s,i)=><a key={i} href={s} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:'var(--teal)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:200}}>🔗 {s.replace('https://','').slice(0,40)}</a>)}
                      </div>
                    )}
                  </div>
                )}
                <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                  <Btn variant="purple" onClick={runAI} disabled={aiRunning||totals.unCount===0}>{aiRunning?aiStatus||'Working…':'🌐 Check Live Rules + Classify Lines'}</Btn>
                  {totals.aiHigh>0&&<Btn variant="teal" onClick={approveHighConfidence}>✓ Approve All High-Confidence ({totals.aiHigh})</Btn>}
                </div>
                {aiFailedCount>0&&<div style={{marginTop:12}}><Alert type="warning">{aiFailedCount} lines could not be classified automatically. They remain untagged so you can review them manually.</Alert></div>}
              </div>
            </Card>

            {/* AI suggestions table */}
            {lines.filter(l=>l.ai_tag&&l.qs==='Untagged').length>0&&(
              <Card>
                <SectionHead label={`Pending AI Suggestions (${lines.filter(l=>l.ai_tag&&l.qs==='Untagged').length})`}/>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                    <thead>
                      <tr style={{background:'var(--bg3)',borderBottom:'0.5px solid var(--border)'}}>
                        {['Src','Vendor / Employee','Memo','Amount','AI Tag','Confidence','Reason','Action'].map(h=><th key={h} style={{padding:'8px 10px',textAlign:'left',fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{h}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {lines.filter(l=>l.ai_tag&&l.qs==='Untagged').map(l=>(
                        <tr key={l.id} style={{borderBottom:'0.5px solid var(--border)',background:l.ai_confidence==='low'?'rgba(192,57,43,0.03)':l.ai_confidence==='high'?'rgba(13,148,136,0.03)':'transparent'}}>
                          <td style={{padding:'7px 10px'}}><Chip color={l.src==='GL'?'navy':'teal'} small>{l.src}</Chip></td>
                          <td style={{padding:'7px 10px',fontWeight:500,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.vendor||l.employee||'—'}</td>
                          <td style={{padding:'7px 10px',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--text2)',fontSize:11}}>{l.memo||l.acct_name||'—'}</td>
                          <td style={{padding:'7px 10px',fontVariantNumeric:'tabular-nums',fontWeight:600,whiteSpace:'nowrap'}}>{fmtd(l.amount)}</td>
                          <td style={{padding:'7px 10px'}}><Pill val={l.ai_tag}/></td>
                          <td style={{padding:'7px 10px'}}><ConfBadge conf={l.ai_confidence}/></td>
                          <td style={{padding:'7px 10px',fontSize:11,color:'var(--text2)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.ai_reason||'—'}</td>
                          <td style={{padding:'7px 10px'}}>
                            <div style={{display:'flex',gap:4}}>
                              <Btn variant="teal" small onClick={()=>applyAISuggestion(l.id)}>Accept</Btn>
                              <select value="" onChange={e=>{
                                const v=e.target.value;
                                if(!v)return;
                                updateLine(l.id,{qs:v,qs_src:'Manual override',warnings:(l.warnings||[]).filter(w=>w!=='Pending AI classification')});
                              }} style={{background:'var(--bg3)',border:'0.5px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:11,color:'var(--text2)',marginLeft:4}}>
                                <option value="">Override…</option>
                                {QUAL_OPTS.map(o=><option key={o} value={o}>{o}</option>)}
                              </select>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            )}

            {totals.aiLow>0&&(
              <div style={{marginTop:12}}><Alert type="warning">{totals.aiLow} lines have low AI confidence — these require manual review before export.</Alert></div>
            )}
          </div>
        )}

        {/* ALL LINES TAB */}
        {tab==='lines'&&(
          <div>
            <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
              <input value={filter.query} onChange={e=>{setFilter(f=>({...f,query:e.target.value}));setPage(0);}} placeholder="Search vendor, memo, employee…" style={{width:260,maxWidth:'100%',background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:'12px',padding:'7px 10px',color:'var(--text)',fontSize:12}}/>
              <select value={filter.qs} onChange={e=>{setFilter(f=>({...f,qs:e.target.value}));setPage(0);}} style={{background:'var(--bg2)',border:'0.5px solid var(--border2)',borderRadius:'var(--radius)',padding:'6px 10px',color:'var(--text)',fontSize:12}}>
                <option value="all">All Statuses</option>{QUAL_OPTS.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
              <select value={filter.src} onChange={e=>{setFilter(f=>({...f,src:e.target.value}));setPage(0);}} style={{background:'var(--bg2)',border:'0.5px solid var(--border2)',borderRadius:'var(--radius)',padding:'6px 10px',color:'var(--text)',fontSize:12}}>
                <option value="all">All Sources</option><option value="GL">GL</option><option value="Payroll">Payroll</option>
              </select>
              {depts.length>0&&<select value={filter.dept} onChange={e=>{setFilter(f=>({...f,dept:e.target.value}));setPage(0);}} style={{background:'var(--bg2)',border:'0.5px solid var(--border2)',borderRadius:'var(--radius)',padding:'6px 10px',color:'var(--text)',fontSize:12}}><option value="all">All Departments</option>{depts.map(d=><option key={d} value={d}>{d}</option>)}</select>}
              <select value={filter.aiConf} onChange={e=>{setFilter(f=>({...f,aiConf:e.target.value}));setPage(0);}} style={{background:'var(--bg2)',border:'0.5px solid var(--border2)',borderRadius:'var(--radius)',padding:'6px 10px',color:'var(--text)',fontSize:12}}>
                <option value="all">All AI Confidence</option><option value="high">AI High</option><option value="medium">AI Medium</option><option value="low">AI Low</option><option value="pending">No AI tag yet</option>
              </select>
              <span style={{marginLeft:'auto',fontSize:12,color:'var(--text3)'}}>{filtered.length.toLocaleString()} of {lines.length.toLocaleString()} lines</span>
            </div>
            {lines.length===0?(
              <div style={{textAlign:'center',color:'var(--text3)',padding:'40px',background:'var(--bg3)',borderRadius:'var(--radius-lg)'}}>No lines yet. Complete Step 2 first.</div>
            ):(
              <Card>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                    <thead>
                      <tr style={{background:'var(--bg3)',borderBottom:'0.5px solid var(--border)'}}>
                        {['Src','Date','Vendor / Employee','Memo','Amount','Qual Status','AI Suggestion','Category','Warn'].map(h=><th key={h} style={{padding:'8px 10px',textAlign:'left',fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{h}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.slice(page*PER_PAGE,(page+1)*PER_PAGE).map(l=>(
                        <tr key={l.id} style={{borderBottom:'0.5px solid var(--border)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                          <td style={{padding:'7px 10px'}}><Chip color={l.src==='GL'?'navy':'teal'} small>{l.src}</Chip></td>
                          <td style={{padding:'7px 10px',color:'var(--text2)',whiteSpace:'nowrap',fontSize:11}}>{l.date||'—'}</td>
                          <td style={{padding:'7px 10px',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:500}}>{l.vendor||l.employee||'—'}</td>
                          <td style={{padding:'7px 10px',maxWidth:130,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                            <div style={{fontSize:11,color:'var(--text2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.memo||l.acct_name||'—'}</div>
                            {l.dept&&<div style={{fontSize:10,color:'var(--text3)'}}>{l.dept}</div>}
                          </td>
                          <td style={{padding:'7px 10px',textAlign:'right',fontVariantNumeric:'tabular-nums',fontWeight:600,color:l.amount<0?'var(--red)':'var(--text)',whiteSpace:'nowrap'}}>{fmtd(l.amount)}</td>
                          <td style={{padding:'7px 10px'}}>
                            <select value={l.qs} onChange={e=>updateLine(l.id,{qs:e.target.value,qs_src:'Manual override',warnings:(l.warnings||[]).filter(w=>w!=='Pending AI classification')})} style={{background:'var(--bg3)',border:'0.5px solid var(--border)',borderRadius:4,padding:'3px 6px',fontSize:11,color:l.qs==='QE'?'var(--teal)':l.qs==='NQ'?'var(--red)':l.qs==='Untagged'?'var(--amber)':'var(--text3)'}}>
                              {QUAL_OPTS.map(o=><option key={o} value={o}>{o}</option>)}
                            </select>
                          </td>
                          <td style={{padding:'7px 10px'}}>
                            {l.ai_tag?<div><div style={{display:'flex',gap:3,alignItems:'center',marginBottom:2}}><Pill val={l.ai_tag}/><ConfBadge conf={l.ai_confidence}/></div><div style={{fontSize:10,color:'var(--text3)',marginTop:1,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.ai_reason}</div></div>:<span style={{color:'var(--text3)',fontSize:11}}>—</span>}
                          </td>
                          <td style={{padding:'7px 10px'}}>
                            <select value={l.cat||''} onChange={e=>updateLine(l.id,{cat:e.target.value})} style={{background:'var(--bg3)',border:'0.5px solid var(--border)',borderRadius:4,padding:'3px 6px',fontSize:11,color:l.cat?'var(--text)':'var(--text3)',minWidth:130}}>
                              <option value="">— assign —</option>
                              {Object.keys(stateCats).map(c=><option key={c} value={c}>{c}</option>)}
                            </select>
                          </td>
                          <td style={{padding:'7px 10px'}}>
                            {l.warnings?.length>0?<span title={l.warnings.join('\n')} style={{cursor:'help'}}><Chip color="amber" small>{l.warnings.length}</Chip></span>:<span style={{color:'var(--text3)',fontSize:11}}>—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                {filtered.length>PER_PAGE&&(
                  <div style={{padding:'10px 16px',display:'flex',gap:10,alignItems:'center',borderTop:'0.5px solid var(--border)',fontSize:12}}>
                    <Btn variant="secondary" small onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={page===0}>← Prev</Btn>
                    <span style={{color:'var(--text2)'}}>Page {page+1} of {Math.ceil(filtered.length/PER_PAGE)}</span>
                    <Btn variant="secondary" small onClick={()=>setPage(p=>p+1)} disabled={(page+1)*PER_PAGE>=filtered.length}>Next →</Btn>
                    <span style={{marginLeft:'auto',color:'var(--text3)'}}>{filtered.length.toLocaleString()} lines</span>
                  </div>
