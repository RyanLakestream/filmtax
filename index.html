// Startup chime — Web Audio API only, no external files, fails silently.
(function(){
  var KEY='filmtax_chime_played';
  function playChime(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      var ctx=new AC();
      var master=ctx.createGain();
      master.gain.value=0.12;
      // Subtle reverb: convolver fed a decaying white-noise impulse response.
      var convolver=ctx.createConvolver();
      var rate=ctx.sampleRate,len=Math.floor(rate*1.2);
      var impulse=ctx.createBuffer(2,len,rate);
      for(var ch=0;ch<2;ch++){
        var data=impulse.getChannelData(ch);
        for(var i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);
      }
      convolver.buffer=impulse;
      var wet=ctx.createGain();wet.gain.value=0.25;
      master.connect(ctx.destination);
      master.connect(convolver);convolver.connect(wet);wet.connect(ctx.destination);
      // Rising C-major triad: C4, E4, G4 staggered 80ms apart.
      var notes=[[261.63,0],[329.63,0.08],[392.0,0.16]];
      notes.forEach(function(n){
        var freq=n[0],start=ctx.currentTime+n[1];
        // sine body + quiet triangle layer for warmth
        [['sine',1],['triangle',0.35]].forEach(function(layer){
          var osc=ctx.createOscillator(),g=ctx.createGain();
          osc.type=layer[0];osc.frequency.value=freq;
          var peak=0.5*layer[1];
          g.gain.setValueAtTime(0,start);
          g.gain.linearRampToValueAtTime(peak,start+0.01);          // attack 0.01s
          g.gain.linearRampToValueAtTime(peak*0.6,start+0.31);      // decay 0.3s → sustain 0.6
          g.gain.setValueAtTime(peak*0.6,start+0.8);
          g.gain.linearRampToValueAtTime(0.0001,start+1.2);         // release 0.4s
          osc.connect(g);g.connect(master);
          osc.start(start);osc.stop(start+1.25);
        });
      });
      try{sessionStorage.setItem(KEY,'1');}catch(e){}
      setTimeout(function(){try{ctx.close();}catch(e){}},2400);
    }catch(e){/* never surface audio errors */}
  }
  function init(){
    try{if(sessionStorage.getItem(KEY))return;}catch(e){return;}
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      var probe=new AC();
      var state=probe.state;
      probe.close();
      if(state==='running'){
        playChime();
      }else{
        // Autoplay policy: wait for the first interaction, then chime once.
        var once=function(){
          window.removeEventListener('pointerdown',once);
          window.removeEventListener('keydown',once);
          playChime();
        };
        window.addEventListener('pointerdown',once);
        window.addEventListener('keydown',once);
      }
    }catch(e){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

// ─── BROWSER PERSISTENCE ────────────────────────────────
const DB_NAME='filmtax_manager_v3';
const DB_VERSION=1;
const DB_STORE='app_state';
const PROJECTS_KEY='projects';

function openDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('DB open failed'));
  });
}
function dbGet(key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readonly');
    const store=tx.objectStore(DB_STORE);
    const req=store.get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('DB read failed'));
  }));
}
function dbSet(key,value){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    const store=tx.objectStore(DB_STORE);
    const req=store.put(value,key);
    req.onsuccess=()=>resolve(true);
    req.onerror=()=>reject(req.error||new Error('DB write failed'));
  }));
}
function dbDelete(key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    const store=tx.objectStore(DB_STORE);
    const req=store.delete(key);
    req.onsuccess=()=>resolve(true);
    req.onerror=()=>reject(req.error||new Error('DB delete failed'));
  }));
}

// ─── FILE PARSER ─────────────────────────────────────────
// CSV: PapaParse with auto-detect delimiter/newline and header trimming.
// XLSX/XLS: SheetJS with first non-empty row treated as headers so blank intro rows don't break import.
function sanitizeHeader(value,index){
  const text=String(value??'').trim();
  return text||`Column ${index+1}`;
}
function normalizeCell(value){
  if(value==null)return '';
  if(typeof value==='string')return value.trim();
  return value;
}

function parseWorkbookRows(ws){
  const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,dateNF:'yyyy-mm-dd',blankrows:false});
  const headerIndex=matrix.findIndex(row=>Array.isArray(row)&&row.some(cell=>String(cell??'').trim()!==''));
  if(headerIndex===-1)throw new Error('File appears empty or has no column headers');
  const headers=(matrix[headerIndex]||[]).map((h,i)=>sanitizeHeader(h,i));
  const rows=matrix.slice(headerIndex+1)
    .filter(row=>Array.isArray(row)&&row.some(cell=>String(cell??'').trim()!==''))
    .map(row=>{
      const obj={};
      headers.forEach((header,i)=>{obj[header]=normalizeCell(row[i]);});
      return obj;
    });
  return {headers,rows};
}

function parseFile(file){
  return new Promise((res,rej)=>{
    const ext=(file.name.toLowerCase().split('.').pop()||'').trim();
    const isCsv=['csv','tsv','txt'].includes(ext);

    if(isCsv){
      Papa.parse(file,{
        header:true,
        skipEmptyLines:'greedy',
        delimiter:'',
        newline:'',
        dynamicTyping:false,
        worker:false,
        transformHeader:(h,i)=>sanitizeHeader(h,i),
        transform:v=>normalizeCell(v),
        complete:result=>{
          const headers=(result.meta?.fields||[]).map((h,i)=>sanitizeHeader(h,i));
          if(!headers.length){rej(new Error('No headers found in CSV'));return;}
          const rows=(result.data||[]).filter(row=>Object.values(row||{}).some(v=>String(v??'').trim()!==''));
          res({headers,rows});
        },
        error:err=>rej(new Error('CSV parse error: '+err.message)),
      });
      return;
    }

    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array',cellText:true,cellDates:false});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const parsed=parseWorkbookRows(ws);
        res(parsed);
      }catch(err){rej(err);}
    };
    reader.onerror=()=>rej(new Error('Failed to read file'));
    reader.readAsArrayBuffer(file);
  });
}

// ─── MONEY PARSER ────────────────────────────────────────
// Handles US and EU-style numbers without relying on browser locale.
function parseMoney(value){
  if(value==null)return 0;
  let s=String(value).trim();
  if(!s||s==='-'||s==='—')return 0;

  const negative=/^\(.*\)$/.test(s)||s.startsWith('-')||s.endsWith('-');
  s=s.replace(/[()]/g,'').replace(/^-/,'').replace(/-$/,'').trim();

  // Remove currency text/symbols, keep digits and separators.
  s=s.replace(/[^\d.,'\s]/g,'').trim();
  if(!s)return 0;

  // Remove spaces/apostrophes used as group separators.
  s=s.replace(/[\s']/g,'');

  const lastDot=s.lastIndexOf('.');
  const lastComma=s.lastIndexOf(',');
  let decimal='';

  if(lastDot>-1 && lastComma>-1){
    decimal=lastDot>lastComma?'.':',';
  }else if(lastDot>-1){
    const digitsAfter=s.length-lastDot-1;
    decimal=digitsAfter===0?'':(digitsAfter<=2?'.':'');
  }else if(lastComma>-1){
    const digitsAfter=s.length-lastComma-1;
    decimal=digitsAfter===0?'':(digitsAfter<=2?',':'');
  }

  if(decimal){
    const group=decimal==='.'?',':'.';
    s=s.split(group).join('');
    if(decimal!=='.')s=s.replace(decimal,'.');
  }else{
    s=s.replace(/[.,]/g,'');
  }

  const n=Number(s);
  if(!Number.isFinite(n))return 0;
  return negative?-n:n;
}

// ─── QUAL TAG NORMALIZER ──────────────────────────────────
// Handles common ledger export variants: QE, Q/E, QUALIFYING,
// NQ, NON-QUAL, NONQUALIFYING, NR, NOT REQUIRED, etc.
function normalizeQualTag(raw){
  const norm=String(raw??'').trim().toUpperCase().replace(/[\-_]+/g,' ').replace(/\s+/g,' ').trim();
  if(!norm)return 'Untagged';
  if(['QE','Q/E','Q E'].includes(norm) || /^QUAL(IFY|IFYING|IFIED)?/.test(norm))return 'QE';
  if(['NQ','N Q','NON QE','NONQ'].includes(norm) || /^(NON ?QUAL|NONQUALIFYING|NOT QUAL|NOT QUALIFYING)/.test(norm))return 'NQ';
  if(['NR','N/R','N R','NOT REQUIRED','NOTREQUIRED','NOT REQ','NOTREQ','NOT APPLICABLE','NOTAPPLICABLE','NA','N A'].includes(norm))return 'Not Required';
  return 'Untagged';
}

const CLAUDE_API_URL='https://api.anthropic.com/v1/messages';
const CLAUDE_API_VERSION='2023-06-01';
// Anthropic announced Claude Sonnet 4 retirement for June 15, 2026, so use Sonnet 4.6 going forward.
const CLAUDE_MODEL='claude-sonnet-4-6';

async function requestClaude(apiKey, body){
  const resp=await fetch(CLAUDE_API_URL,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':CLAUDE_API_VERSION,
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify(body),
  });
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok){
    const message=data?.error?.message||`API error ${resp.status}`;
    throw new Error(message);
  }
  return data;
}

function extractTextBlocks(data){
  return (data?.content||[])
    .filter(block=>block?.type==='text' && typeof block.text==='string')
    .map(block=>block.text)
    .join('\n')
    .trim();
}

function extractWebSources(data){
  const urls=[];
  (data?.content||[]).forEach(block=>{
    if(block?.type==='web_search_tool_result' && Array.isArray(block.content)){
      block.content.forEach(item=>{if(item?.url)urls.push(item.url);});
    }
    if(block?.type==='text' && Array.isArray(block.citations)){
      block.citations.forEach(c=>{if(c?.url)urls.push(c.url);});
    }
  });
  return [...new Set(urls)].slice(0,6);
}

async function verifyApiKey(apiKey){
  await requestClaude(apiKey,{model:CLAUDE_MODEL,max_tokens:16,messages:[{role:'user',content:'Reply with OK.'}]});
  return true;
}

    : '';

    const batch=lines.slice(i,i+BATCH);
    if(onStatus)onStatus(`Classifying lines ${i+1}–${Math.min(i+BATCH,lines.length)} of ${lines.length}…`);

BUILT-IN ${stateAbbr} RULES:

${categoryList}

Classify each line as one of:
- QE = qualifying expense

Return ONLY a JSON object shaped exactly like this, with one entry per input line:

"tag" must be QE, NQ, or NR. "confidence" must be high, medium, or low. Keep reasons under 12 words. Use low confidence if the information is incomplete or ambiguous. Use an empty string for category if none fits. Do not wrap the JSON in markdown fences or add any other text.

${lineDescriptions}`;

    try{
      const data=await requestClaude(apiKey,{
        model:CLAUDE_MODEL,
        max_tokens:2000,
        messages:[{role:'user',content:prompt}],
      });

      const rawText=extractTextBlocks(data);
      const tryParse=(s)=>{
        try{return JSON.parse(s);}catch{
          const fixed=s.replace(/```json|```/g,'').trim().replace(/,\s*([\]}])/g,'$1');
          return JSON.parse(fixed);
        }
      };
      let parsed=null;
      const objStart=rawText.indexOf('{');const objEnd=rawText.lastIndexOf('}');
      const arrStart=rawText.indexOf('[');const arrEnd=rawText.lastIndexOf(']');
      if(objStart!==-1&&objEnd!==-1){try{const cand=tryParse(rawText.slice(objStart,objEnd+1));if(cand&&Array.isArray(cand.results))parsed=cand;}catch{}}
      if(!parsed&&arrStart!==-1&&arrEnd!==-1){try{parsed={results:tryParse(rawText.slice(arrStart,arrEnd+1))};}catch{}}

      const items=Array.isArray(parsed?.results)?parsed.results:[];

      items.forEach((r,idx)=>{
        if(!r||typeof r!=='object')return;
        const rowIndex=typeof r.line==='number'?r.line-1:idx;
        const line=batch[rowIndex]||batch[idx];
        if(!line)return;
        const tag=['QE','NQ','NR'].includes(r.tag)?r.tag:null;
        const conf=['high','medium','low'].includes(r.confidence)?r.confidence:'low';
        const category=categoryNames.includes(r.category)?r.category:'';
        results[line.id]={
          ai_tag:tag==='NR'?'Not Required':tag,
          ai_confidence:conf,
          ai_reason:typeof r.reason==='string'?r.reason.slice(0,96):'',
          ai_cat:category,
          ai_failed:false,
        };
      });

      batch.forEach(line=>{
        if(!results[line.id]){
          results[line.id]={
            ai_tag:null,
            ai_confidence:'low',
            ai_reason:'No structured result returned',
            ai_cat:'',
            ai_failed:true,
          };
        }
      });
    }catch(e){
      batch.forEach(line=>{
        results[line.id]={
          ai_tag:null,
          ai_confidence:'low',
          ai_reason:'Classification failed: '+e.message.slice(0,72),
          ai_cat:'',
          ai_failed:true,
        };
      });
    }

    if(onProgress)onProgress(Math.min(100,Math.round(((i+BATCH)/lines.length)*100)));
    if(i+BATCH<lines.length)await new Promise(r=>setTimeout(r,220));
  }

  return results;
}

const PROGRAM_ACCENT={CA:'#fbbf24',NY:'#3b82f6',NY_COMMERCIAL:'#06b6d4'};

// NY 40% rule: total ATL cannot exceed atlCap × all other qualified spend.
function computeAtlStats(lines,prog,stateCats){
  if(!prog||!prog.atlCap)return null;
  const qe=(lines||[]).filter(l=>l.qs==='QE');
  const isAtl=l=>!!(l.cat&&stateCats[l.cat]&&stateCats[l.cat].atl);
  const atlAmt=sumAmt(qe.filter(isAtl));
  const btlAmt=sumAmt(qe.filter(l=>!isAtl(l)));
  const cap=btlAmt*prog.atlCap;
  const overage=Math.max(0,atlAmt-cap);
  const adjusted=btlAmt+Math.min(atlAmt,cap);
  return {atlAmt,btlAmt,cap,overage,adjusted};
}

const inputStyle={width:'100%',background:'var(--bg-3)',border:'1px solid var(--border-strong)',borderRadius:'var(--radius)',padding:'10px 14px',color:'var(--text)',colorScheme:'dark'};

function ProjectsPage({projects,onCreate,onOpen,onDelete}){
  const [showForm,setShowForm]=useState(false);
  const [query,setQuery]=useState('');
  const emptyForm={name:'',entity:'',state:'CA',tier:'Mid-Budget ($1M–$10M)',ptype:'',start:'',end:''};
  const [form,setForm]=useState(emptyForm);

  function openForm(state){
    setForm({...emptyForm,state:state&&STATE_PROGRAMS[state]?state:'CA'});
    setShowForm(true);
  }
  function handleCreate(){
    if(!form.name.trim()||!form.entity.trim())return;
    onCreate({id:uid(),name:form.name.trim(),entity:form.entity.trim(),state:form.state,tier:form.tier,ptype:form.ptype,start:form.start,end:form.end,status:'Active',created:new Date().toISOString(),uploads:[],lines:[],vendors:{},mappings:{},exports:[],liveRules:null,lastOpenedAt:null,preparedBy:'',docChecklist:{}});
    setShowForm(false);
    setForm(emptyForm);
  }

  const filtered=projects.filter(p=>{
    const q=query.trim().toLowerCase();
    if(!q)return true;
    return [p.name,p.entity,p.state,p.tier].some(v=>String(v||'').toLowerCase().includes(q));
  });

  const stats={
    projects:projects.length,
    qe:projects.reduce((s,p)=>s+sumAmt((p.lines||[]).filter(l=>l.qs==='QE')),0),
    review:projects.reduce((s,p)=>s+((p.lines||[]).filter(l=>l.qs==='Untagged').length),0),
    warnings:projects.reduce((s,p)=>s+countWarnings(p.lines||[]),0),
  };

    <div style={{flex:1,padding:32,maxWidth:1060}}>
      <PageHeader
        eyebrow="Workspace"
        title="Your Projects"
        subtitle="Film & TV production incentives for CA and NY."
        actions={<Btn variant="primary" onClick={()=>openForm()}>+ New Project</Btn>}

            <div style={{height:4,background:PROGRAM_ACCENT[k]}}/>

              <div style={{fontWeight:800,fontSize:13,color:'var(--text)',marginBottom:8,lineHeight:1.4}}>{v.displayName||v.name}</div>

              <div style={{fontSize:11,color:'var(--text-3)',lineHeight:1.55,marginBottom:10}}>{v.rateNote}</div>

              <div style={{marginTop:12,fontSize:12,fontWeight:700,color:'var(--blue-bright)'}}>Start a project →</div>
            </div>
          </div>

        <StatTile label="Projects" value={stats.projects} color="var(--blue-bright)" glow="var(--blue)"/>
        <StatTile label="Potential QE tracked" value={fmt(stats.qe)} color="var(--emerald)" glow="var(--emerald)"/>

            );

                {Object.entries(STATE_PROGRAMS).map(([k,v])=>{
                  const sel=form.state===k;
                  return (
                    <div key={k} onClick={()=>setForm(f=>({...f,state:k,ptype:''}))} style={{border:`2px solid ${sel?PROGRAM_ACCENT[k]:'var(--border)'}`,background:sel?'var(--bg-card-hover)':'var(--bg-card)',borderRadius:'var(--radius)',padding:'12px 14px',cursor:'pointer',position:'relative',boxShadow:sel?`0 0 20px ${PROGRAM_ACCENT[k]}40`:'none',transition:'all 0.2s ease'}}>
                      {sel&&<span style={{position:'absolute',top:10,right:10,width:18,height:18,borderRadius:'50%',background:PROGRAM_ACCENT[k],display:'inline-flex',alignItems:'center',justifyContent:'center'}}><CheckIcon size={10} color="var(--bg)"/></span>}
                      <div style={{fontWeight:800,fontSize:12.5,color:'var(--text)',marginBottom:6,paddingRight:22,lineHeight:1.4}}>{v.displayName||v.name}</div>
                      <div className="tnum" style={{fontSize:18,fontWeight:800,color:PROGRAM_ACCENT[k]}}>{v.rate}</div>
                      <div style={{fontSize:11,color:'var(--text-3)',marginTop:5,lineHeight:1.5}}>{v.atlNote}</div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              <Field label="Project name" required>
                <input type="text" placeholder='e.g. "Hudson River Chronicles"' value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} style={inputStyle}/>
              </Field>
              <Field label="Production entity" required>
                <input type="text" placeholder='e.g. "Hudson Films LLC"' value={form.entity} onChange={e=>setForm(f=>({...f,entity:e.target.value}))} style={inputStyle}/>
              </Field>
            </div>
            <Field label="Budget tier">
              <Segmented options={TIERS} value={form.tier} onChange={t=>setForm(f=>({...f,tier:t}))}/>
            </Field>
            <Field label="Production type" help="Optional — helps your team identify the project at a glance.">
              <PillSelect options={getStateProgram(form.state).productionTypes||[]} value={form.ptype} onChange={v=>setForm(f=>({...f,ptype:v}))}/>
            </Field>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              <Field label="Production start">
                <input type="date" value={form.start} onChange={e=>setForm(f=>({...f,start:e.target.value}))} style={inputStyle}/>
              </Field>
              <Field label="Production end">
                <input type="date" value={form.end} onChange={e=>setForm(f=>({...f,end:e.target.value}))} style={inputStyle}/>
              </Field>
            </div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end',paddingTop:12,borderTop:'1px solid var(--border)'}}>
              <Btn variant="secondary" onClick={()=>setShowForm(false)}>Cancel</Btn>
              <Btn variant="primary" onClick={handleCreate} disabled={!form.name.trim()||!form.entity.trim()}>Create project</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── STEP 1: UPLOAD ───────────────────────────────────────

  if(type==='Trial Balance')return <svg {...common}><path d="M12 3v15" stroke={color} strokeWidth="1.6" strokeLinecap="round"/><path d="M4 6h16" stroke={color} strokeWidth="1.6" strokeLinecap="round"/><path d="M4 6 1.5 11h5L4 6Z" stroke={color} strokeWidth="1.4" strokeLinejoin="round"/><path d="M20 6 17.5 11h5L20 6Z" stroke={color} strokeWidth="1.4" strokeLinejoin="round"/><path d="M8 21h8" stroke={color} strokeWidth="1.6" strokeLinecap="round"/></svg>;
  return <svg {...common}><rect x="4.5" y="2.5" width="15" height="19" rx="1.5" stroke={color} strokeWidth="1.6"/><path d="M8 7.5h8M8 11.5h8M8 15.5h5" stroke={color} strokeWidth="1.6" strokeLinecap="round"/></svg>;
}
function UploadStep({project,onUpdate}){
  const [dragging,setDragging]=useState(null);
  const [parsing,setParsing]=useState(false);
  const [pendingType,setPendingType]=useState('GL');
  const [message,setMessage]=useState('');
  const [error,setError]=useState('');
  const [rulesOpen,setRulesOpen]=useState(false);
  const fileInputRef=useRef(null);
  const uploads=project.uploads||[];

  async function handleFile(file,type){
    if(!file)return;
    if(uploads.length>=20){setError('Maximum 20 uploads per project reached.');return;}
    setParsing(true);setError('');setMessage('');
    try{
      const {headers,rows}=await parseFile(file);
      const upload={id:uid(),name:file.name,type,date:new Date().toISOString(),headers,rows,size:file.size};
      onUpdate({...project,uploads:[...uploads,upload]});
      setMessage(`${file.name} imported successfully — ${rows.length.toLocaleString()} rows found.`);
    }catch(e){
      setError('Could not parse file: '+e.message);
    }
    setParsing(false);
  }

  function handleDrop(e,type){e.preventDefault();setDragging(null);handleFile(e.dataTransfer.files[0],type);}

  function removeUpload(id){
    const remaining=uploads.filter(u=>u.id!==id);
    const remainingIds=new Set(remaining.map(u=>u.id));
    const cleanedLines=(project.lines||[]).filter(l=>{
      const uploadId=l.id.split('_').slice(1,-1).join('_');
      return remainingIds.has(uploadId);
    });
    const cleanedVendors={};
    Object.entries(project.vendors||{}).forEach(([name,v])=>{if(cleanedLines.some(l=>l.vendor===name))cleanedVendors[name]=v;});
    const cleanedMappings={};
    Object.entries(project.mappings||{}).forEach(([k,v])=>{
      if(k==='GL'||k==='Payroll')cleanedMappings[k]=v;
      else if(remainingIds.has(k))cleanedMappings[k]=v;
    });
    const stalledExports=(project.exports||[]).map(e=>({...e,stale:true}));
    onUpdate({...project,uploads:remaining,lines:cleanedLines,vendors:cleanedVendors,mappings:cleanedMappings,exports:stalledExports});
    setMessage('Upload removed. Existing exports were marked stale.');
  }

  function downloadTemplate(type){
    const rows=type==='GL'
      ? [['Date','Account Number','Account Name','Vendor','Memo','Amount','Department','Qualification Tag'],['2026-01-05','6100','Equipment Rentals','CameraCo','Lens package week 1','12500','Camera','QE']]
      : [['Employee Name','Payroll Amount','Department','Date','Residency Status','Qualification Tag'],['Jamie Rivera','2850','Grip','2026-01-12','NY Resident','QE']];
    const csv=rows.map(r=>r.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download=`film_tax_${type.toLowerCase()}_template.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }

  const prog=getStateProgram(project.state);
  const FILE_TYPES=[
    {type:'GL',label:'General ledger',desc:'Vendor, memo, account, amount, department'},
    {type:'Payroll',label:'Payroll',desc:'Employee, amount, date, department, residency'},
    {type:'Trial Balance',label:'Trial balance',desc:'Optional reference file for tie-out work'},
  ];

  return (
    <div style={{flex:1,padding:32,maxWidth:980}}>
      <PageHeader
        eyebrow="Step 1 of 4"
        title="Upload files"
        subtitle={`Bring in your GL and payroll exports for ${prog.name}. The app stores full file data in browser storage so you can come back and remap later without losing the imported rows.`}
        badge={<Chip color="navy">{prog.abbr} program</Chip>}
      />

      <Card style={{marginBottom:14}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',borderBottom:'1px solid var(--border)'}}>
          {[['Credit rate',prog.rate,prog.rateNote],['Minimum spend',fmt(prog.minSpend),prog.minSpendNote],['Above-the-line',prog.atl?'Eligible — capped':'Excluded',prog.atlNote]].map(([l,v,s])=>(
            <div key={l} style={{padding:'16px 18px',borderRight:'1px solid var(--border)'}}>
              <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',fontWeight:700,marginBottom:6}}>{l}</div>
              <div className="tnum" style={{fontSize:18,fontWeight:800,color:'var(--text)',letterSpacing:'-0.02em'}}>{v}</div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:4,lineHeight:1.5}}>{s}</div>
            </div>
          ))}
        </div>
        <div style={{padding:'13px 18px',display:'grid',gap:8}}>
          {(prog.keyRules||[]).slice(0,3).map((r,i)=>(
            <div key={i} style={{display:'flex',gap:9,fontSize:12.5,color:'var(--text-2)',lineHeight:1.55}}>
              <span style={{color:'var(--teal)',fontWeight:800,flexShrink:0}}>•</span><span>{r}</span>
            </div>
          ))}
        </div>
      </Card>

      <Card style={{marginBottom:20,borderLeft:'3px solid var(--border-blue)'}}>
        <button onClick={()=>setRulesOpen(o=>!o)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'13px 18px',background:'rgba(255,255,255,0.03)',border:'none',color:'var(--text-2)',boxShadow:'none'}}>
          <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--text-3)'}}>Program Rules Summary — {prog.displayName||prog.name}</span>
          <span style={{display:'inline-flex',alignItems:'center',gap:8,fontSize:11,color:'var(--text-3)'}}>{(prog.keyRules||[]).length} rules <Chevron open={rulesOpen}/></span>
        </button>
        {rulesOpen&&(
          <div style={{padding:'14px 18px',display:'grid',gap:9,borderTop:'1px solid var(--border)'}}>
            {(prog.keyRules||[]).map((r,i)=>(
              <div key={i} style={{display:'flex',gap:9,fontSize:12.5,color:'var(--text-2)',lineHeight:1.6}}>
                <span style={{color:'var(--teal)',fontWeight:800,flexShrink:0}}>•</span><span>{r}</span>
              </div>
            ))}
          </div>
        )}
      </Card>

      <div style={{display:'grid',gap:12,marginBottom:18}}>
        {FILE_TYPES.map(({type,label,desc})=>{
          const active=dragging===type;
          const done=uploads.some(u=>u.type===type);
          return (
            <div key={type} onDragOver={e=>{e.preventDefault();setDragging(type);}} onDragLeave={()=>setDragging(null)} onDrop={e=>handleDrop(e,type)} onClick={()=>{setPendingType(type);fileInputRef.current.click();}}
              style={{minHeight:100,display:'flex',alignItems:'center',gap:20,padding:'18px 26px',border:active?'1.5px solid var(--blue)':done?'1.5px solid rgba(16,185,129,0.3)':'1.5px dashed var(--border-2)',borderRadius:'var(--r-lg)',cursor:'pointer',background:active?'var(--blue-dim)':done?'var(--emerald-dim)':'var(--bg-card)',boxShadow:active?'var(--glow-blue)':'var(--shadow)',transition:'all 0.2s ease'}}>
              <FileTypeIcon type={type} color={active?'var(--blue-bright)':done?'var(--emerald)':'var(--text-3)'}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:3,flexWrap:'wrap'}}>
                  <span style={{fontWeight:800,fontSize:15,color:'var(--text)',letterSpacing:'-0.01em'}}>{label}</span>
                  {type==='Trial Balance'&&<Chip color="gray" small>Optional</Chip>}
                </div>
                <div style={{fontSize:13,color:'var(--text-2)',fontWeight:600}}>Drop file here or click to browse</div>
                <div style={{fontSize:12,color:'var(--text-3)',marginTop:2}}>{desc} · CSV or Excel</div>
              </div>
              {type!=='Trial Balance'&&<Btn variant="secondary" small onClick={e=>{e.stopPropagation();downloadTemplate(type);}} style={{flexShrink:0}}>Template</Btn>}
            </div>
          );
        })}
      </div>

      <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls,.tsv,.txt" style={{display:'none'}} onChange={e=>{handleFile(e.target.files[0],pendingType);e.target.value='';}}/>
      {parsing&&<Alert type="info" style={{marginBottom:14}}>Parsing file… depending on size, this can take a few seconds.</Alert>}
      {message&&<Alert type="success" style={{marginBottom:14}}>{message}</Alert>}
      {error&&<Alert type="error" style={{marginBottom:14}}>{error}</Alert>}

      {uploads.length>0?(
        <Card style={{marginBottom:16}}>
          <SectionHead label={`Uploaded files (${uploads.length} / 20)`} sub="You can remove and replace files at any time. Removing a file also marks prior exports as stale."/>
          <div>
            {uploads.map(u=>(
              <div key={u.id} style={{display:'flex',alignItems:'center',gap:14,padding:'13px 18px',borderBottom:'1px solid var(--border)',borderLeft:'3px solid rgba(16,185,129,0.35)'}}>
                <FileTypeIcon type={u.type} size={20} color="var(--text-3)"/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.name}</div>
                  <div className="tnum" style={{color:'var(--text-3)',fontSize:11,marginTop:2}}>{(u.rows||[]).length.toLocaleString()} rows · {(u.headers||[]).length} columns · added {formatDate(u.date)}</div>
                </div>
                <Chip color="teal" small><CheckIcon size={9} color="var(--teal)"/> Ready</Chip>
                <Chip color={u.type==='GL'?'navy':u.type==='Payroll'?'teal':'gray'} small>{u.type}</Chip>
                <Btn variant="danger" small onClick={()=>removeUpload(u.id)}>Remove</Btn>
              </div>
            ))}
          </div>
        </Card>
      ):(
        <EmptyState icon={<svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true" style={{opacity:0.5}}><path d="M12 16V4M12 4 7 9M12 4l5 5" stroke="var(--blue)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M4 16v2.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V16" stroke="var(--blue)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>} title="Nothing uploaded yet" text="Start with your GL and payroll files. The mapping step becomes much easier once the files are in." />
      )}

      <Alert type="info"><strong>Tip:</strong> If your exports already include a qualification field such as QE / NQ, map that column in Step 2. The AI will only work on the lines that remain untagged.</Alert>
    </div>
  );
}

// ─── STEP 2: MAP ──────────────────────────────────────────
const GL_FIELDS=[
  {k:'date',l:'Date',req:true},{k:'account_number',l:'Account Number'},{k:'account_name',l:'Account Name'},
  {k:'vendor',l:'Vendor / Payee'},{k:'memo',l:'Memo / Description'},
  {k:'amount',l:'Amount (net)',note:'Use this OR map Debit + Credit below'},{k:'debit',l:'Debit'},{k:'credit',l:'Credit'},
  {k:'department',l:'Department / Cost Center'},{k:'qual_tag',l:'Qualification Tag',pref:true,note:'If your export already contains QE/NQ values, map that column'},
];
const PAY_FIELDS=[
  {k:'employee_name',l:'Employee Name',req:true},{k:'amount',l:'Payroll Amount',req:true},
  {k:'department',l:'Department'},{k:'date',l:'Date'},
  {k:'qual_tag',l:'Qualification Tag',pref:true,note:'If your export already contains QE/NQ values, map that column'},
  {k:'residency',l:'Residency Status',note:'Helpful for programs that require resident or in-state labor tests'},
];
const AUTO_HINTS={
  GL:{date:['date','transaction date','tran date','posting date','post date'],account_number:['account number','account no','account #','acct no','acct #','account_number'],account_name:['account name','account description','acct name'],vendor:['vendor','payee','supplier','vendor name','payee name'],memo:['memo','description','desc','narration','notes','reference'],amount:['amount','net amount','net','total','transaction amount'],debit:['debit','dr','debit amount'],credit:['credit','cr','credit amount'],department:['department','dept','cost center','division','cost_center'],qual_tag:['qual','qualification','qe/nq','qualifying','qual tag','qualify','qual_tag','q tag']},
  Payroll:{employee_name:['employee','employee name','name','full name','emp name','worker'],amount:['amount','gross','pay','salary','payroll amount','total pay','wages','gross pay'],department:['department','dept','division'],date:['date','pay date','period','period end','check date'],qual_tag:['qual','qualification','qe/nq','qualifying','qual tag','qualify','qual_tag'],residency:['residency','resident','state','residence','tax state','home state']},
};

function MapStep({project,onUpdate}){
  const [tab,setTab]=useState('GL');
  const [maps,setMaps]=useState(project.mappings||{GL:{},Payroll:{}});
  const [processed,setProcessed]=useState(false);
  const [message,setMessage]=useState('');
  const [error,setError]=useState('');
  const glUploads=(project.uploads||[]).filter(u=>u.type==='GL');
  const payUploads=(project.uploads||[]).filter(u=>u.type==='Payroll');
  const activeUploads=tab==='GL'?glUploads:payUploads;
  const [activeUploadIdx,setActiveUploadIdx]=useState(0);

  useEffect(()=>{
    setActiveUploadIdx(idx=>activeUploads.length===0?0:Math.min(idx,activeUploads.length-1));
  },[tab,activeUploads.length]);

  const activeUpload=activeUploads[activeUploadIdx];
  const cols=activeUpload?.headers||[];
  const fields=tab==='GL'?GL_FIELDS:PAY_FIELDS;
  const mapKey=activeUpload?.id||tab;
  const curMap=maps[mapKey]||(maps[tab]||{});
  const previewRows=(activeUpload?.rows||[]).slice(0,5);
  const mappedFields=fields.filter(f=>curMap[f.k]);
  const mapPct=fields.length?Math.round(mappedFields.length/fields.length*100):0;

  function autoMap(){
    const hints=AUTO_HINTS[tab]||{};
    const nm={};
    const lc=s=>(s||'').toLowerCase().trim();
    Object.entries(hints).forEach(([field,keywords])=>{
      let match=null;
      for(const kw of keywords){
        match=cols.find(col=>lc(col)===kw);
        if(match)break;
      }
      if(!match){
        for(const kw of keywords){
          match=cols.find(col=>lc(col).includes(kw));
          if(match)break;
        }
      }
      if(match)nm[field]=match;
    });
    setMaps(m=>({...m,[mapKey]:{...(m[mapKey]||{}),...nm}}));
    setMessage('Best-guess mappings applied. Review them before processing.');
  }

  function getUploadIssues(type,upload,map){
    const issues=[];
    if(type==='GL'){
      if(!map.date)issues.push('Map Date');
      if(!(map.amount||(map.debit&&map.credit)))issues.push('Map Amount or both Debit + Credit');
    }else if(type==='Payroll'){
      if(!map.employee_name)issues.push('Map Employee Name');
      if(!map.amount)issues.push('Map Payroll Amount');
    }
    if(!upload?.rows?.length)issues.push('File has no data rows');
    return issues;
  }

  function processLines(){
    const mappingIssues=[];
    glUploads.forEach(up=>{
      const m=maps[up.id]||maps.GL||{};
      const issues=getUploadIssues('GL',up,m);
      if(issues.length)mappingIssues.push(`${up.name}: ${issues.join(', ')}`);
    });
    payUploads.forEach(up=>{
      const m=maps[up.id]||maps.Payroll||{};
      const issues=getUploadIssues('Payroll',up,m);
      if(issues.length)mappingIssues.push(`${up.name}: ${issues.join(', ')}`);
    });

    if(mappingIssues.length){
      setError('Fix these mappings before processing: '+mappingIssues.join(' · '));
      setMessage('');
      return;
    }

    const lines=[];
    glUploads.forEach(up=>{
      const m=maps[up.id]||maps.GL||{};
      (up.rows||[]).forEach((row,i)=>{
        const rawTag=(row[m.qual_tag]||'').toString().trim();
        const qs=normalizeQualTag(rawTag);
        const qs_src=qs!=='Untagged'?'Imported from source file':'Pending AI classification';
        const amount=m.amount&&row[m.amount]!==undefined&&row[m.amount]!==''
          ? parseMoney(row[m.amount])
          : (parseMoney(row[m.debit]||0)-parseMoney(row[m.credit]||0));
        const warns=[];
        if(!String(row[m.vendor]||'').trim())warns.push('Missing Vendor');
        if(!String(row[m.memo]||'').trim()&&!String(row[m.account_name]||'').trim())warns.push('Missing Memo / Account Name');
        if(!String(row[m.date]||'').trim())warns.push('Missing Date');
        if(amount<0)warns.push('Negative Amount');
        if(amount===0)warns.push('Zero Amount');
        if(qs==='Untagged')warns.push('Pending AI classification');
        lines.push({
          id:`gl_${up.id}_${i}`,
          src:'GL',
          date:(row[m.date]||'').toString(),
          acct:(row[m.account_number]||'').toString(),
          acct_name:(row[m.account_name]||'').toString(),
          vendor:(row[m.vendor]||'').toString(),
          memo:(row[m.memo]||'').toString(),
          amount,
          dept:(row[m.department]||'').toString(),
          qs,
          qs_src,
          cat:'',
          warnings:warns,
          raw_qual:rawTag,
          ai_tag:null,
          ai_confidence:null,
          ai_reason:null,
          ai_cat:null,
          ai_failed:false,
        });
      });
    });
    payUploads.forEach(up=>{
      const m=maps[up.id]||maps.Payroll||{};
      (up.rows||[]).forEach((row,i)=>{
        const rawTag=(row[m.qual_tag]||'').toString().trim();
        const qs=normalizeQualTag(rawTag);
        const qs_src=qs!=='Untagged'?'Imported from source file':'Pending AI classification';
        const amount=parseMoney(row[m.amount]||0);
        const residency=(row[m.residency]||'').toString();
        const employee=(row[m.employee_name]||'').toString();
        const warns=[];
        if(!employee)warns.push('Missing Employee Name');
        if(!residency)warns.push('Missing Employee Residency');
        if(!String(row[m.date]||'').trim())warns.push('Missing Date');
        if(qs==='Untagged')warns.push('Pending AI classification');
        if(amount<0)warns.push('Negative Amount');
        if(amount===0)warns.push('Zero Amount');
        lines.push({
          id:`pay_${up.id}_${i}`,
          src:'Payroll',
          date:(row[m.date]||'').toString(),
          employee,
          amount,
          dept:(row[m.department]||'').toString(),
          residency,
          qs,
          qs_src,
          cat:'',
          warnings:warns,
          raw_qual:rawTag,
          ai_tag:null,
          ai_confidence:null,
          ai_reason:null,
          ai_cat:null,
          ai_failed:false,
        });
      });
    });
    const vendors={};
    lines.filter(l=>l.src==='GL'&&l.vendor).forEach(l=>{
      if(!vendors[l.vendor]){
        const existing=(project.vendors||{})[l.vendor];
        vendors[l.vendor]={name:l.vendor,status:existing?.status||'',id:existing?.id||uid()};
      }
    });
    onUpdate({...project,mappings:maps,lines,vendors});
    setProcessed(true);
    setError('');
    setMessage(`${lines.length.toLocaleString()} lines processed successfully. Review them in Step 3.`);
  }

  const issues=getUploadIssues(tab,activeUpload,curMap);

  return (
    <div style={{flex:1,padding:32,maxWidth:1060}}>
      <PageHeader
        eyebrow="Step 2 of 4"
        title="Map columns"
        subtitle="Map each uploaded file once. The app saves mappings per file so mixed exports do not stomp on each other."
        badge={<Chip color="teal">{((project.uploads||[]).length)} uploads</Chip>}
      />

      <div style={{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
        {['GL','Payroll'].map(t=><Btn key={t} variant={tab===t?'primary':'secondary'} onClick={()=>setTab(t)} small>{t==='GL'?'General Ledger':'Payroll'}</Btn>)}
      </div>

      {error&&<Alert type="error" style={{marginBottom:14}}>{error}</Alert>}
      {message&&<Alert type="success" style={{marginBottom:14}}>{message}</Alert>}

      {activeUploads.length===0?(
        <EmptyState icon={<FileTypeIcon type={tab} size={40} color="var(--blue)"/>} title={`No ${tab} files yet`} text={`Upload at least one ${tab==='GL'?'general ledger':'payroll'} file in Step 1 to start mapping columns.`} />
      ):(
        <div style={{display:'grid',gridTemplateColumns:'minmax(0,1.25fr) minmax(330px,0.95fr)',gap:16,alignItems:'start'}}>
          <Card>
            <SectionHead
              label={`${tab==='GL'?'General Ledger':'Payroll'} mapping`}
              sub={activeUpload?.name||''}
              action={<div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                {activeUploads.length>1&&<select value={activeUploadIdx} onChange={e=>setActiveUploadIdx(Number(e.target.value))} style={{background:'var(--bg-3)',border:'1px solid var(--border-strong)',borderRadius:'var(--radius)',padding:'6px 10px'}}>{activeUploads.map((u,i)=><option key={u.id} value={i}>{u.name}</option>)}</select>}
                <Btn variant="teal" small onClick={autoMap}><SparkIcon/> Auto-detect columns</Btn>
              </div>}
            />
            <div style={{padding:'14px 18px 6px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,color:'var(--text-3)',marginBottom:6}}>
                <span style={{fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em'}}>Mapping completeness</span>
                <span className="tnum" style={{fontWeight:700}}>{mapPct}%</span>
              </div>
              <ProgressBar pct={mapPct} color={mapPct===100?'var(--green)':'var(--teal)'} height={5}/>
            </div>
            <div style={{padding:'12px 18px 18px'}}>
              <div style={{display:'grid',gap:12}}>
                {fields.map(f=>{
                  const mapped=!!curMap[f.k];
                  return (
                    <div key={f.k} style={{display:'grid',gridTemplateColumns:'220px 1fr',alignItems:'start',gap:12}}>
                      <div style={{paddingTop:8}}>
                        <div style={{fontSize:13,color:'var(--text)',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                          <span style={{fontWeight:700}}>{f.l}{f.req&&<span style={{color:'var(--red)'}}> *</span>}</span>
                          {f.pref&&<Chip color="amber" small>PREFERRED</Chip>}
                        </div>
                        {f.note&&<div style={{fontSize:11,color:'var(--text-3)',marginTop:3,lineHeight:1.45}}>{f.note}</div>}
                      </div>
                      <div style={{position:'relative'}}>
                        <select value={curMap[f.k]||''} onChange={e=>setMaps(m=>({...m,[mapKey]:{...(m[mapKey]||{}),[f.k]:e.target.value}}))} style={{width:'100%',background:'var(--bg-3)',border:`1px solid ${mapped?'var(--border-teal)':'var(--border-strong)'}`,borderRadius:'var(--radius)',padding:mapped?'9px 30px 9px 11px':'9px 11px',color:mapped?'var(--text)':'var(--text-3)',marginTop:2}}>
                          <option value="">— not mapped —</option>
                          {cols.map(c=><option key={c} value={c}>{c}</option>)}
                        </select>
                        {mapped&&<span style={{position:'absolute',right:30,top:'50%',transform:'translateY(-43%)',width:16,height:16,borderRadius:'50%',background:'var(--green)',display:'inline-flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}><CheckIcon size={9}/></span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </Card>

          <div style={{display:'grid',gap:16}}>
            <Card>
              <SectionHead label="Readiness check"/>
              <div style={{padding:'16px 18px',display:'grid',gap:10,fontSize:13}}>
                {issues.length===0
                  ? <Alert type="success">Ready to process — this file has all required mappings.</Alert>
                  : <div style={{display:'grid',gap:6}}>
                      {issues.map(i=><div key={i} style={{display:'flex',gap:8,alignItems:'center',color:'var(--red)',fontSize:12.5,fontWeight:600}}><span style={{width:6,height:6,borderRadius:'50%',background:'var(--red)',flexShrink:0}}/>{i}</div>)}
                    </div>}
                <div className="tnum" style={{display:'flex',justifyContent:'space-between',color:'var(--text-2)'}}><span>Columns detected</span><strong>{cols.length}</strong></div>
                <div className="tnum" style={{display:'flex',justifyContent:'space-between',color:'var(--text-2)'}}><span>Data rows</span><strong>{(activeUpload?.rows||[]).length.toLocaleString()}</strong></div>
                <div className="tnum" style={{display:'flex',justifyContent:'space-between',color:'var(--text-2)'}}><span>Mapped fields</span><strong>{mappedFields.length} of {fields.length}</strong></div>
              </div>
            </Card>

            <Card>
              <SectionHead label="Live preview" sub="First 5 rows through your current mapping"/>
              <div style={{overflowX:'auto'}}>
                {mappedFields.length===0?(
                  <div style={{padding:'18px',fontSize:12,color:'var(--text-3)',lineHeight:1.6}}>Nothing mapped yet. Map a field on the left — or hit <strong>Auto-detect columns</strong> — and the preview fills in here.</div>
                ):(
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                    <thead>
                      <tr style={{background:'rgba(255,255,255,0.03)',borderBottom:'1px solid var(--border)'}}>
                        {mappedFields.slice(0,5).map(f=>(
                          <th key={f.k} style={{padding:'8px 10px',textAlign:'left'}}>
                            <div style={{fontSize:10,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em'}}>{f.l}</div>
                            <div style={{fontSize:10,color:'var(--teal)',fontWeight:700,textTransform:'none',letterSpacing:'normal'}}>← {curMap[f.k]}</div>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {previewRows.length>0?previewRows.map((row,idx)=>(
                        <tr key={idx} style={{borderBottom:'1px solid var(--border)'}}>
                          {mappedFields.slice(0,5).map(f=><td key={f.k} className="tnum" style={{padding:'8px 10px',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{String(row[curMap[f.k]]??'')}</td>)}
                        </tr>
                      )):(<tr><td style={{padding:'12px 10px',color:'var(--text-3)'}} colSpan={Math.max(1,mappedFields.slice(0,5).length)}>No preview rows available.</td></tr>)}
                    </tbody>
                  </table>
                )}
              </div>
            </Card>
          </div>
        </div>
      )}

      <div style={{display:'flex',alignItems:'center',gap:12,marginTop:18,flexWrap:'wrap'}}>
        <Btn variant="primary" onClick={processLines} disabled={glUploads.length===0&&payUploads.length===0}>Apply mappings & process lines</Btn>
        {processed&&<Chip color="green">Ready for Step 3</Chip>}
      </div>
    </div>
  );
}

// ─── STEP 3: REVIEW ───────────────────────────────────────
const PER_PAGE=100;

function ReviewStep({project,onUpdate}){
  const [tab,setTab]=useState('summary');
  const [filter,setFilter]=useState({qs:'all',src:'all',dept:'all',warn:'all',cat:'all',aiConf:'all',query:''});
  const [page,setPage]=useState(0);
  const [aiRunning,setAiRunning]=useState(false);
  const [aiProgress,setAiProgress]=useState(0);
  const [aiStatus,setAiStatus]=useState('');
  const [aiError,setAiError]=useState('');
  const [liveRules,setLiveRules]=useState(project.liveRules||null);
  const [catSuggest,setCatSuggest]=useState(null);
  const lines=project.lines||[];
  const vendors=project.vendors||{};
  const prog=getStateProgram(project.state);
  const stateCats=getStateCats(project.state);

  const totals=useMemo(()=>{
    const t={QE:0,NQ:0,Untagged:0,'Not Required':0,gl:0,pay:0,total:0,warns:0,qeCount:0,nqCount:0,unCount:0,nrCount:0,aiHigh:0,aiMed:0,aiLow:0,aiPending:0};
    lines.forEach(l=>{
      const a=l.amount||0;t[l.qs]=(t[l.qs]||0)+a;
      if(l.qs==='QE')t.qeCount++;if(l.qs==='NQ')t.nqCount++;if(l.qs==='Untagged')t.unCount++;if(l.qs==='Not Required')t.nrCount++;
      if(l.src==='GL')t.gl+=a;if(l.src==='Payroll')t.pay+=a;t.total+=a;t.warns+=(l.warnings?.length||0);
      if(l.ai_tag&&l.qs==='Untagged'){if(l.ai_confidence==='high')t.aiHigh++;else if(l.ai_confidence==='medium')t.aiMed++;else if(l.ai_confidence==='low')t.aiLow++;}
      if(!l.ai_tag&&l.qs==='Untagged')t.aiPending++;
    });
    return t;
  },[lines]);

  const warnBreakdown=useMemo(()=>{const b={};lines.forEach(l=>(l.warnings||[]).forEach(w=>{b[w]=(b[w]||0)+1;}));return b;},[lines]);
  const catTotals=useMemo(()=>{const b={};lines.forEach(l=>{if(!l.cat)return;if(!b[l.cat])b[l.cat]={total:0,count:0};b[l.cat].total+=(l.amount||0);b[l.cat].count++;});return b;},[lines]);
  const depts=[...new Set(lines.map(l=>l.dept).filter(Boolean))].sort();
  const aiFailedCount=lines.filter(l=>l.qs==='Untagged'&&l.ai_failed).length;
  const atlStats=useMemo(()=>computeAtlStats(lines,prog,stateCats),[lines,prog,stateCats]);

  const filtered=useMemo(()=>lines.filter(l=>{
    const haystack=[l.vendor,l.employee,l.memo,l.acct_name,l.dept,l.acct,l.residency].join(' ').toLowerCase();
    if(filter.query&& !haystack.includes(filter.query.toLowerCase()))return false;
    if(filter.qs!=='all'&&l.qs!==filter.qs)return false;
    if(filter.src!=='all'&&l.src!==filter.src)return false;
    if(filter.dept!=='all'&&l.dept!==filter.dept)return false;
    if(filter.warn==='yes'&&(!l.warnings||l.warnings.length===0))return false;
    if(filter.cat==='__none'&&l.cat)return false;
    if(filter.cat&&filter.cat!=='all'&&filter.cat!=='__none'&&l.cat!==filter.cat)return false;
    if(filter.aiConf==='pending'&&l.ai_tag)return false;
    if(filter.aiConf==='high'&&l.ai_confidence!=='high')return false;
    if(filter.aiConf==='medium'&&l.ai_confidence!=='medium')return false;
    if(filter.aiConf==='low'&&l.ai_confidence!=='low')return false;
    return true;
  }),[lines,filter]);

  function updateLine(id,patch){onUpdate({...project,lines:lines.map(l=>l.id===id?{...l,...patch}:l)});}
  function updateVendor(name,patch){onUpdate({...project,vendors:{...vendors,[name]:{...(vendors[name]||{}),name,...patch}}});}

  // Frequency analysis over this project's own lines — no AI call.
  function getCatSuggestions(line){
    const counts={};
    const vkey=(line.vendor||line.employee||'').toLowerCase().trim();
    const tokens=(line.memo||line.acct_name||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
    lines.forEach(o=>{
      if(o.id===line.id||!o.cat)return;
      const okey=(o.vendor||o.employee||'').toLowerCase().trim();
      const sameVendor=!!vkey&&okey===vkey;
      const omemo=(o.memo||o.acct_name||'').toLowerCase();
      const sharesToken=tokens.some(t=>omemo.includes(t));
      if(sameVendor||sharesToken)counts[o.cat]=(counts[o.cat]||0)+(sameVendor?2:1);
    });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  }

  async function runAI(){
    const apiKey=loadApiKey();
    if(!apiKey){setAiError('No API key set. Go to AI Settings and enter your Anthropic API key.');return;}
    const untagged=lines.filter(l=>l.qs==='Untagged');
    if(!untagged.length){setAiError('No untagged lines to classify.');return;}
    setAiRunning(true);setAiError('');setAiProgress(0);setAiStatus('');setLiveRules(null);
    try{
      // Step 1: fetch live rules
      const fetched = await fetchLiveRules(project.state, apiKey, setAiStatus);
      setLiveRules(fetched);
      if(fetched.error){
        setAiStatus('Web search unavailable — using built-in rules. Classifying lines…');
      } else {
        setAiStatus('Live rules retrieved. Classifying lines…');
      }
      // Step 2: classify with live rules injected
      const results=await classifyLinesWithAI(
        untagged, project.state, apiKey,
        (pct)=>setAiProgress(pct),
        setAiStatus,
        fetched
      );
      const updated=lines.map(l=>{
        if(results[l.id])return {...l,...results[l.id]};
        return l;
      });
      onUpdate({...project,lines:updated,liveRules:fetched,lastAiRunAt:new Date().toISOString()});
      setAiStatus('Done.');
    }catch(e){setAiError('AI classification failed: '+e.message);}
    setAiRunning(false);setAiProgress(100);
  }

  function approveHighConfidence(){
    const updated=lines.map(l=>{
      if(l.ai_tag&&l.ai_confidence==='high'&&l.qs==='Untagged'){
        return {
          ...l,
          qs:l.ai_tag,
          qs_src:'AI classified (approved)',
          cat:l.ai_cat||l.cat,
          warnings:(l.warnings||[]).filter(w=>w!=='Pending AI classification'),
        };
      }
      return l;
    });
    onUpdate({...project,lines:updated});
  }

  function applyAISuggestion(id){
    const l=lines.find(x=>x.id===id);
    if(!l||!l.ai_tag)return;
    updateLine(id,{qs:l.ai_tag,qs_src:'AI classified (approved)',cat:l.ai_cat||l.cat,warnings:(l.warnings||[]).filter(w=>w!=='Pending AI classification')});
  }

  const suggestionCount=lines.filter(l=>l.ai_tag&&l.qs==='Untagged').length;
  const hasAiResults=totals.aiHigh+totals.aiMed+totals.aiLow>0;
  const qeTotal=totals.QE;
  const minPct=prog.minSpend?Math.round(qeTotal/prog.minSpend*100):100;
  const minMet=qeTotal>=prog.minSpend;
  const minColor=minMet?'var(--green)':qeTotal>=prog.minSpend*0.7?'var(--amber)':'var(--red)';
  const poolNear=project.state==='NY_COMMERCIAL'&&qeTotal>=3000000*0.8;
  const poolOver=project.state==='NY_COMMERCIAL'&&qeTotal>=4000000;

  const TABS=[{id:'summary',l:'Summary'},{id:'ai',l:`AI Review${hasAiResults?` (${totals.aiHigh+totals.aiMed+totals.aiLow})`:''}`},{id:'lines',l:`All Lines (${lines.length.toLocaleString()})`},{id:'vendors',l:`Vendors (${Object.keys(vendors).length})`},{id:'warnings',l:`Warnings (${totals.warns})`}];

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
      <div style={{padding:'24px 32px 0',background:'rgba(255,255,255,0.02)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:4,fontWeight:700}}>Step 3 of 4</div>
        <h2 style={{fontSize:22,fontWeight:800,color:'var(--text)',marginBottom:12,letterSpacing:'-0.02em'}}>Review lines <span style={{color:'var(--teal)',fontSize:15,fontWeight:700}}>· {prog.name}</span></h2>
        <TabBar tabs={TABS} active={tab} onChange={setTab}/>
      </div>

      <div style={{flex:1,overflow:'auto',padding:24}}>

        {/* SUMMARY TAB */}
        {tab==='summary'&&(
          <div style={{maxWidth:1020}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12,marginBottom:12}}>
              <StatTile big label="Qualifying (QE)" value={fmt(totals.QE)} color="var(--emerald)" glow="var(--emerald)" sub={`${totals.qeCount} lines`}/>
              <StatTile big label="Non-Qualifying (NQ)" value={fmt(totals.NQ)} color="var(--rose)" glow="var(--rose)" sub={`${totals.nqCount} lines`}/>
              <StatTile big label="Untagged" value={fmt(totals.Untagged)} color="var(--amber)" glow="var(--amber)" sub={`${totals.unCount} lines`}/>
              <StatTile big label="Grand Total" value={fmt(totals.total)} color="var(--blue-bright)" glow="var(--blue)" sub={`${lines.length.toLocaleString()} lines`}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginBottom:18}}>
              <StatTile label="GL Total" value={fmt(totals.gl)}/>
              <StatTile label="Payroll Total" value={fmt(totals.pay)}/>
              <StatTile label="Not Required" value={fmt(totals['Not Required'])} sub={`${totals.nrCount} lines`}/>
            </div>

            {/* FEATURE: Qualification Health scorecard */}
            <Card style={{marginBottom:16}}>
              <SectionHead label="Qualification Health" sub={`How this project tracks against ${prog.name} thresholds`}/>
              <div style={{padding:'16px 18px',display:'grid',gap:14}}>
                <div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,fontSize:12.5}}>
                    <span style={{fontWeight:700,color:'var(--text)'}}>Minimum qualified spend</span>
                    <span className="tnum" style={{color:'var(--text-2)'}}>{fmt(qeTotal)} of {fmt(prog.minSpend)} <strong style={{color:minColor}}>({Math.min(999,minPct)}%)</strong></span>
                  </div>
                  <ProgressBar pct={minPct} color={minColor}/>
                  <div style={{fontSize:11,color:'var(--text-3)',marginTop:5}}>{minMet?'Threshold met — based on currently tagged QE.':prog.minSpendNote}</div>
                </div>
                {project.state==='NY'&&(
                  <Alert type="info"><strong>QPF requirement:</strong> document your Qualified Production Facility usage — minimum 1 full day (Level 1) or 10%+ of principal photography days (Level 2). Keep the shoot log with your records.</Alert>
                )}
                {project.state==='CA'&&(
                  <Alert type="info"><strong>75% test:</strong> verify that 75% of principal photography days — or 75% of the production budget — lands in California. Keep the shoot log ready for the CPA AUP report.</Alert>
                )}
                {project.state==='NY_COMMERCIAL'&&(
                  poolOver
                    ?<Alert type="error"><strong>Pool cap exceeded:</strong> tagged QE ({fmt(qeTotal)}) is past the $4M downstate annual pool ($3M upstate). Credits are awarded from limited pools — confirm allocation with ESD before relying on this amount.</Alert>
                    :poolNear
                      ?<Alert type="warning"><strong>Pool cap warning:</strong> tagged QE ({fmt(qeTotal)}) is approaching the annual pools — $4M downstate / $3M upstate. The pools fill quickly; apply early.</Alert>
                      :<div style={{fontSize:12,color:'var(--text-3)',display:'flex',gap:8}}><span style={{color:'var(--teal)',fontWeight:800}}>✓</span>Annual pool caps: $4M downstate / $3M upstate — current QE is comfortably inside both.</div>
                )}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap',borderTop:'1px solid var(--border)',paddingTop:12}}>
                  <div style={{fontSize:12.5}}>
                    <span style={{fontWeight:700,color:'var(--text)'}}>Untagged lines remaining: </span>
                    <span className="tnum" style={{color:totals.unCount>0?'var(--amber)':'var(--green)',fontWeight:800}}>{totals.unCount}</span>
                  </div>
                  {totals.unCount>0&&<Btn variant="purple" small onClick={()=>setTab('ai')}>Classify remaining →</Btn>}
                </div>
              </div>
            </Card>

            {/* FEATURE: ATL cap calculator (NY film only) */}
            {atlStats&&(
              <Card style={{marginBottom:16}}>
                <SectionHead label="ATL Cap Calculator — 40% Rule" sub="NY: total ATL cannot exceed 40% of all other qualified spend. Updates live as lines are tagged."/>
                <div style={{padding:'16px 18px'}}>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',border:'1px solid var(--border)',borderRadius:'var(--r)',overflow:'hidden'}}>
                    {[
                      ['BTL Qualified',fmt(atlStats.btlAmt),'var(--text)',false],
                      ['ATL Spend',fmt(atlStats.atlAmt),atlStats.overage>0?'var(--rose)':'var(--text)',atlStats.overage>0],
                      ['Cap Limit (40%)',fmt(atlStats.cap),'var(--text-2)',false],
                    ].map(([label,val,color,hot],i)=>(
                      <div key={label} style={{padding:'16px 18px',borderRight:i<2?'1px solid var(--border)':'none',background:hot?'var(--rose-dim)':'transparent'}}>
                        <div style={{fontSize:10,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',fontWeight:700,marginBottom:8}}>{label}</div>
                        <div className="tnum" style={{fontSize:22,fontWeight:800,color,letterSpacing:'-0.02em'}}>{val}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 2px 0',flexWrap:'wrap',gap:10}}>
                    <span style={{fontSize:13,color:'var(--text-2)'}}>Adjusted qualified total <span className="tnum" style={{color:'var(--teal)',fontWeight:800}}>{fmt(atlStats.adjusted)}</span></span>
                    {atlStats.overage>0&&<span className="tnum" style={{fontSize:13,fontWeight:700,color:'var(--rose)'}}>Overage: {fmt(atlStats.overage)}</span>}
                  </div>
                  {atlStats.overage>0
                    ?<div style={{marginTop:12}}><Alert type="error">ATL spend exceeds the 40% cap by {fmt(atlStats.overage)}. The overage will not earn credit — the adjusted qualified total above reflects the capped amount.</Alert></div>
                    :<div style={{marginTop:12,fontSize:12,color:'var(--text-3)'}}>Lines count as ATL when their assigned category is an ATL category (Director, Screenwriter, Producer, Principal Actor). Assign categories in the All Lines tab for an accurate split.</div>}
                </div>
              </Card>
            )}

            {totals.warns>0&&<div style={{marginBottom:16}}><Alert type="warning">{totals.warns} validation warnings. Review the Warnings tab before export.</Alert></div>}
            {Object.keys(catTotals).length>0&&(
              <Card>
                <SectionHead label={`${prog.name} Category Breakdown`}/>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                    <thead><tr style={{background:'rgba(255,255,255,0.03)',borderBottom:'1px solid var(--border)'}}>{['Category','Qualified?','Amount','Lines'].map(h=><th key={h} style={{padding:'8px 14px',textAlign:'left',fontSize:10,fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em'}}>{h}</th>)}</tr></thead>
                    <tbody>
                      {Object.entries(catTotals).sort((a,b)=>b[1].total-a[1].total).map(([cat,v])=>(
                        <tr key={cat} style={{borderBottom:'1px solid var(--border)'}} className="row-hover">
                          <td style={{padding:'9px 14px',fontWeight:500}}>{cat}{stateCats[cat]?.atl&&<Chip color="purple" small style={{marginLeft:6}}>ATL</Chip>}</td>
                          <td style={{padding:'9px 14px'}}><Chip color={stateCats[cat]?.q?'teal':'red'} small>{stateCats[cat]?.q?'Qualified':'Non-Qualified'}</Chip></td>
