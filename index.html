// ─── FORMULA INJECTION ESCAPE ────────────────────────────
// Prefix cells starting with =, +, -, @ with a tab to prevent Excel/Sheets
// from executing them as formulas. Only applied to string values.
function esc(v){
  if(typeof v!=='string')return v;
  if(v.length>0&&'=+-@\t\r'.includes(v[0]))return '\t'+v;
  return v;
}
function escRow(arr){return arr.map(esc);}

// ─── STEP 4: EXPORT ───────────────────────────────────────
function ExportStep({project,onUpdate}){
  const [busy,setBusy]=useState(false);
  const [lastFile,setLastFile]=useState(null);
  const [error,setError]=useState('');
  const [preparedBy,setPreparedBy]=useState(project.preparedBy||'');
  const lines=project.lines||[];
  const vendors=project.vendors||{};
  const prog=getStateProgram(project.state);
  const stateCats=getStateCats(project.state);

  const qeLines=lines.filter(l=>l.qs==='QE');
  const nqLines=lines.filter(l=>l.qs==='NQ');
  const untLines=lines.filter(l=>l.qs==='Untagged');
  const nrLines=lines.filter(l=>l.qs==='Not Required');
  const glLines=lines.filter(l=>l.src==='GL');
  const payLines=lines.filter(l=>l.src==='Payroll');
  const warns=lines.reduce((s,l)=>s+(l.warnings?.length||0),0);
  const aiClassified=lines.filter(l=>l.qs_src&&l.qs_src.includes('AI classified')).length;
  const liveRules=project.liveRules;
  const requiredDocs=prog.requiredDocs||[];
  const checklist=project.docChecklist||{};
  const docsDone=requiredDocs.filter(d=>checklist[d]).length;
  const atlStats=computeAtlStats(lines,prog,stateCats);

  function savePreparedBy(){
    if((project.preparedBy||'')!==preparedBy)onUpdate({...project,preparedBy});
  }
  function toggleDoc(doc){
    onUpdate({...project,docChecklist:{...checklist,[doc]:!checklist[doc]}});
  }

  function doExport(){
    if(!lines.length)return;
    setBusy(true);setError('');
    try{
      const wb=XLSX.utils.book_new();
      const today=new Date().toISOString().split('T')[0];
      const catBreakdown={};
      lines.forEach(l=>{if(!l.cat)return;if(!catBreakdown[l.cat])catBreakdown[l.cat]={total:0,count:0,qualified:stateCats[l.cat]?.q?'Yes':'No'};catBreakdown[l.cat].total+=(l.amount||0);catBreakdown[l.cat].count++;});

      // Tab 1: Cover Sheet
      const coverRows=[
        ['PRODUCTION INCENTIVE EXPORT — COVER SHEET'],[''],
        ['Production',project.name],
        ['Production Entity',project.entity],
        ['State Program',prog.displayName||`${prog.name} (${prog.abbr})`],
        ['Credit / Incentive Rate',prog.rate],
        ['Production Type',project.ptype||''],
        ['Budget Tier',project.tier||''],
        ['Export Date',today],
        ['Prepared By',preparedBy||project.preparedBy||''],[''],
        ['SUMMARY TOTALS','',''],
        ['Status','Amount ($)','Line Count'],
        ['Qualifying Expenses (QE)',sumAmt(qeLines),qeLines.length],
        ['Non-Qualifying Expenses (NQ)',sumAmt(nqLines),nqLines.length],
        ['Untagged',sumAmt(untLines),untLines.length],
        ['Not Required',sumAmt(nrLines),nrLines.length],
        ['Grand Total',sumAmt(lines),lines.length],[''],
        ['KEY PROGRAM RULES'],
        ...(prog.keyRules||[]).map(r=>[r]),[''],
        ['DISCLAIMER'],
        ['Prepared for review purposes. Consult a CPA before submission.'],
      ];
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(coverRows),'Cover Sheet');

      const summaryRows=[
        [`${prog.name.toUpperCase()} FILM TAX CREDIT — PRODUCTION ACCOUNTING SUMMARY`],[''],
        ['Project Name',project.name],['Production Entity',project.entity],
        ['State Program',`${prog.name} (${prog.abbr})`],['Credit / Incentive Rate',prog.rate],
        ['Budget Tier',project.tier],['Production Start',project.start||''],['Production End',project.end||''],
        ['Export Date',today],['AI-Classified Lines Approved',aiClassified],['Live Rule Check Saved',liveRules?.summary?'Yes':'No'],[''],
        ['QUALIFICATION SUMMARY','',''],['Status','Amount ($)','Line Count'],
        ['Qualifying Expenses (QE)',sumAmt(qeLines),qeLines.length],
        ['Non-Qualifying Expenses (NQ)',sumAmt(nqLines),nqLines.length],
        ['Untagged',sumAmt(untLines),untLines.length],
        ['Not Required',sumAmt(nrLines),nrLines.length],
        ['Grand Total',sumAmt(lines),lines.length],[''],
        ['SOURCE SUMMARY','',''],['GL Total',sumAmt(glLines),glLines.length],['Payroll Total',sumAmt(payLines),payLines.length],[''],
        ['VALIDATION','',''],['Total Warnings',warns,''],[''],
        ['CATEGORY BREAKDOWN','','',''],['Category','Qualified?','Amount ($)','Line Count'],
        ...Object.entries(catBreakdown).sort((a,b)=>b[1].total-a[1].total).map(([cat,v])=>[cat,v.qualified,v.total,v.count]),
      ];
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summaryRows),`${prog.abbr} Summary`);

      const confSummary=l=>l.ai_confidence?`AI ${l.ai_confidence}${l.qs_src?` — ${l.qs_src}`:''}`:(l.qs_src||'');
      const qvHeaders=['Date','Account #','Account Name','Vendor','Memo','Department','Amount','Category','Qual Source','AI Confidence','Vendor Status'];
      const qeHeaders=[...qvHeaders,'Confidence Summary'];
      const qvRows=qeLines.filter(l=>l.src==='GL').map(l=>escRow([l.date,l.acct,l.acct_name,l.vendor,l.memo,l.dept,l.amount,l.cat,l.qs_src,l.ai_confidence||'',vendors[l.vendor]?.status||'',confSummary(l)]));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([qeHeaders,...qvRows]),'QE Vendor Schedule');

      const nqRows=nqLines.filter(l=>l.src==='GL').map(l=>escRow([l.date,l.acct,l.acct_name,l.vendor,l.memo,l.dept,l.amount,l.cat,l.qs_src,l.ai_confidence||'',vendors[l.vendor]?.status||'']));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([qvHeaders,...nqRows]),'NQ Vendor Schedule');

      const payHeaders=['Employee','Date','Department','Amount','Residency','Qual Status','Qual Source','AI Confidence','AI Reason','Category'];
      const payRows=payLines.map(l=>escRow([l.employee,l.date,l.dept,l.amount,l.residency||'',l.qs,l.qs_src,l.ai_confidence||'',l.ai_reason||'',l.cat]));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([payHeaders,...payRows]),'Payroll Schedule');

      // NY only: ATL Cap Analysis tab
      if(atlStats){
        const atlRows=[
          ['ATL CAP ANALYSIS — 40% RULE'],[''],
          ['Rule',prog.atlCapNote||'Total ATL costs cannot exceed 40% of all other qualified production costs'],[''],
          ['Metric','Amount ($)'],
          ['Qualified BTL / other spend (QE, non-ATL categories)',atlStats.btlAmt],
          ['Qualified ATL spend (QE, ATL categories)',atlStats.atlAmt],
          ['ATL cap limit (40% of other qualified spend)',atlStats.cap],
          ['ATL overage above cap',atlStats.overage],
          ['Adjusted qualified total (BTL + capped ATL)',atlStats.adjusted],[''],
          ['Note','Lines are treated as ATL when their assigned category is an ATL category (Director, Screenwriter, Producer, Principal Actor).'],
        ];
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(atlRows),'ATL Cap Analysis');
      }

      // Required documents checklist tab
      if(requiredDocs.length){
        const docRows=[
          [`REQUIRED DOCUMENTS — ${prog.name.toUpperCase()}`],[''],
          ['Document','Status'],
          ...requiredDocs.map(d=>[d,checklist[d]?'Collected':'Pending']),[''],
          ['Collected',`${docsDone} of ${requiredDocs.length}`],
        ];
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(docRows),'Document Checklist');
      }

      if(liveRules?.summary){
        const liveRows=[
          ['Latest Rule Check Summary'],
          ['State',prog.name],
          ['Checked At',liveRules.checkedAt?new Date(liveRules.checkedAt).toLocaleString():''],
          ['Model',liveRules.model||''],
          [''],
          ['Summary'],
          [liveRules.summary],
          [''],
          ['Sources'],
          ...(liveRules.sources||[]).map(url=>[url]),
        ];
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(liveRows),'Live Rules');
      }

      const fname=`${(project.name||'Project').replace(/[^a-zA-Z0-9]/g,'_')}_${prog.abbr.replace(/[^a-zA-Z0-9]/g,'_')}_Export_${today}.xlsx`;
      XLSX.writeFile(wb,fname);
      const run={id:uid(),date:today,filename:fname,lines:lines.length,qe:sumAmt(qeLines),nq:sumAmt(nqLines),warns,aiClassified};
      onUpdate({...project,preparedBy,exports:[...(project.exports||[]),run]});
      setLastFile(fname);
    }catch(e){
      setError('Export failed: '+e.message);
    }
    setBusy(false);
  }

  const readiness=[
    {label:'Files processed',ok:lines.length>0,detail:`${lines.length.toLocaleString()} lines ready`},
    {label:'Untagged lines reviewed',ok:untLines.length===0,detail:untLines.length?`${untLines.length} still untagged`:'All lines tagged'},
    {label:'Warnings checked',ok:warns===0,detail:warns?`${warns} warnings remain`:'No warnings'},
    {label:'Required documents collected',ok:requiredDocs.length>0&&docsDone===requiredDocs.length,detail:`${docsDone} of ${requiredDocs.length} ticked off below`},
    {label:'Live rule check saved',ok:!!liveRules?.summary,detail:liveRules?.summary?'Included in export workbook':'Optional but recommended'},
  ];

  const workbookTabs=[
    'Cover Sheet — production info, totals, key rules, disclaimer',
    `${prog.abbr} Summary — project info, totals, category breakdown`,
    'QE Vendor Schedule — qualifying GL lines with confidence summary',
    'NQ Vendor Schedule — non-qualifying GL lines',
    'Payroll Schedule — all payroll lines with residency and AI details',
    atlStats?'ATL Cap Analysis — the NY 40% rule calculation':null,
    requiredDocs.length?'Document Checklist — submission readiness status':null,
    liveRules?.summary?'Live Rules — saved rule check summary and source links':null,
  ].filter(Boolean);

  return (
    <div style={{flex:1,padding:32,maxWidth:900}}>
      <PageHeader
        eyebrow="Step 4 of 4"
        title="Export package"
        subtitle={`Create the ${prog.name} workbook with clean tabs for the cover sheet, summary, vendor schedules, payroll, and the latest saved rule check.`}
        badge={<Chip color="teal">{prog.abbr} export</Chip>}
      />

      {error&&<Alert type="error" style={{marginBottom:14}}>{error}</Alert>}
      {lastFile&&<Alert type="success" style={{marginBottom:14}}>Downloaded: {lastFile}</Alert>}

      <div className="grid-auto-wide" style={{marginBottom:18}}>
        <Card>
          <SectionHead label="Pre-export checklist"/>
          <div style={{padding:'16px 18px',display:'grid',gap:12}}>
            {readiness.map(item=>(
              <div key={item.label} style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                <span style={{width:20,height:20,borderRadius:'50%',background:item.ok?'var(--green)':'var(--amber-light)',border:item.ok?'none':'1.5px solid var(--amber)',display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>{item.ok?<CheckIcon size={10}/>:<span style={{width:6,height:6,borderRadius:'50%',background:'var(--amber)'}}/>}</span>
                <div>
                  <div style={{fontWeight:700,color:'var(--text)',fontSize:13}}>{item.label}</div>
                  <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{item.detail}</div>
                </div>
              </div>
            ))}
          </div>
        </Card>
        <Card>
          <SectionHead label="Qualification summary"/>
          <div style={{padding:'16px 18px',display:'grid',gap:10}}>
            {[['Qualifying (QE)',fmt(sumAmt(qeLines)),`${qeLines.length} lines`,'var(--teal)'],['Non-Qualifying (NQ)',fmt(sumAmt(nqLines)),`${nqLines.length} lines`,'var(--red)'],['Untagged',fmt(sumAmt(untLines)),`${untLines.length} lines`,'var(--amber)'],['Not Required',fmt(sumAmt(nrLines)),`${nrLines.length} lines`,'var(--text-3)'],['Grand Total',fmt(sumAmt(lines)),`${lines.length} lines`,'var(--blue-bright)']].map(([label,val,sub,col])=><div key={label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid var(--border)',paddingBottom:8}}><span style={{fontSize:13,color:'var(--text)'}}>{label}</span><div style={{textAlign:'right'}}><div className="tnum" style={{fontWeight:800,color:col,fontSize:14}}>{val}</div><div style={{fontSize:11,color:'var(--text-3)'}}>{sub}</div></div></div>)}
          </div>
        </Card>
      </div>

      {/* FEATURE: required documents checklist */}
      <Card style={{marginBottom:18}}>
        <SectionHead label={`Required documents — ${prog.name}`} sub="Tick items off as you collect them. The status exports as its own workbook tab." action={<Chip color={docsDone===requiredDocs.length&&requiredDocs.length>0?'green':'amber'}>{docsDone} / {requiredDocs.length}</Chip>}/>
        <div style={{padding:'8px 0'}}>
          {requiredDocs.map(doc=>{
            const on=!!checklist[doc];
            return (
              <button key={doc} onClick={()=>toggleDoc(doc)} style={{display:'flex',width:'100%',textAlign:'left',alignItems:'flex-start',gap:12,padding:'10px 18px',background:'none',border:'none',borderBottom:'1px solid var(--border)',cursor:'pointer',boxShadow:'none'}}>
                <span style={{width:18,height:18,borderRadius:'var(--radius-sm)',border:on?'none':'1.5px solid var(--border-strong)',background:on?'var(--teal)':'transparent',display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>{on&&<CheckIcon size={10} color="var(--bg)"/>}</span>
                <span style={{fontSize:13,color:on?'var(--text-3)':'var(--text-2)',textDecoration:on?'line-through':'none',lineHeight:1.5}}>{doc}</span>
              </button>
            );
          })}
        </div>
        <div style={{padding:'12px 18px'}}>
          <ProgressBar pct={requiredDocs.length?docsDone/requiredDocs.length*100:0} color={docsDone===requiredDocs.length?'var(--green)':'var(--teal)'}/>
        </div>
      </Card>

      <Card style={{marginBottom:18}}>
        <SectionHead label="Workbook contents"/>
        <div style={{padding:'16px 18px',display:'grid',gap:14}}>
          <Field label="Prepared by" help="Appears on the cover sheet of the exported workbook.">
            <input type="text" value={preparedBy} onChange={e=>setPreparedBy(e.target.value)} onBlur={savePreparedBy} placeholder="e.g. Jordan Avery, Production Accountant" style={{...inputStyle,maxWidth:420}}/>
          </Field>
          <div style={{display:'grid',gap:9}}>
            {workbookTabs.map((item,i)=><div key={item} style={{display:'flex',gap:9,fontSize:13,color:'var(--text-2)'}}><span style={{color:'var(--teal)',fontWeight:800}}>{i+1}.</span><span>{item}</span></div>)}
          </div>
        </div>
      </Card>

      {aiClassified>0&&<div style={{marginBottom:14}}><Alert type="info">{aiClassified} lines were AI-classified and approved. Their confidence levels and reasons are included in the exported sheets.</Alert></div>}
      {untLines.length>0&&<div style={{marginBottom:14}}><Alert type="warning">You still have {untLines.length} untagged lines. You can export now, but this is usually worth reviewing first.</Alert></div>}
      {warns>0&&<div style={{marginBottom:18}}><Alert type="warning">{warns} validation warnings remain. Export is still allowed so you can keep moving.</Alert></div>}

      <Btn variant="primary" onClick={doExport} disabled={busy||lines.length===0} style={{padding:'14px 28px',fontSize:14}}>{busy?'Generating workbook…':lines.length===0?'No lines to export':<><DownloadIcon/> Download workbook</>}</Btn>

      {(project.exports||[]).length>0&&(
        <div style={{marginTop:28}}>
          <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10,fontWeight:700}}>Export history</div>
          {[...(project.exports||[])].reverse().map(e=>(
            <div key={e.id} style={{background:'var(--bg-card)',border:`1px solid ${e.stale?'rgba(245,158,11,0.35)':'var(--border)'}`,borderRadius:'var(--radius)',padding:'12px 14px',marginBottom:8,display:'grid',gridTemplateColumns:'24px 1fr auto auto auto',gap:10,alignItems:'center',fontSize:12,boxShadow:'var(--shadow-sm)'}}>
              <span style={{display:'flex',alignItems:'center',color:'var(--text-3)'}}><DownloadIcon size={16}/></span>
              <span style={{color:'var(--text-2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.filename}</span>
              <span className="tnum" style={{color:'var(--teal)',fontWeight:800,whiteSpace:'nowrap'}}>{fmt(e.qe)} QE</span>
              {e.stale&&<Chip color="amber" small>stale</Chip>}
              <span className="tnum" style={{color:'var(--text-3)',whiteSpace:'nowrap'}}>{e.date}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────
const LS_WELCOMED='filmtax_welcomed_v1';
function App(){
  const [projects,setProjects]=useState([]);
  const [project,setProject]=useState(null);
  const [view,setView]=useState('projects');
  const [loadingProjects,setLoadingProjects]=useState(true);
  const [storageMessage,setStorageMessage]=useState('');
  const [saveState,setSaveState]=useState('idle');
  const [storageMode,setStorageMode]=useState('indexeddb');
  const [showWelcome,setShowWelcome]=useState(()=>!loadApiKey()&&!localStorage.getItem(LS_WELCOMED));

  useEffect(()=>{
    let mounted=true;
    loadProjects()
      .then(data=>{if(mounted)setProjects(Array.isArray(data)?data:[]);})
      .catch(()=>{if(mounted)setStorageMessage('Could not load saved projects from browser storage.');})
      .finally(()=>{if(mounted)setLoadingProjects(false);});
    return ()=>{mounted=false;};
  },[]);

  useEffect(()=>{
    if(loadingProjects)return;
    let cancelled=false;
    const t=setTimeout(()=>{
      setSaveState('saving');
      saveProjects(projects)
        .then(()=>{if(cancelled)return;setSaveState('saved');setTimeout(()=>{if(!cancelled)setSaveState('idle');},1200);})
        .catch(()=>{if(cancelled)return;setStorageMode('localStorage');setSaveState('saved');setStorageMessage('IndexedDB was unavailable, so the app fell back to basic browser storage. Your work is still being saved, but very large projects may be less reliable.');});
    },250);
    return ()=>{cancelled=true;clearTimeout(t);};
  },[projects,loadingProjects]);

  function dismissWelcome(){
    localStorage.setItem(LS_WELCOMED,'1');
    setShowWelcome(false);
  }

  function createProject(p){setProjects(prev=>[...prev,p]);setProject(p);setView('upload');}
  function openProject(p){
    const latest=projects.find(x=>x.id===p.id)||p;
    const opened={...latest,lastOpenedAt:new Date().toISOString()};
    setProject(opened);
    setProjects(prev=>prev.map(item=>item.id===opened.id?opened:item));
    setView(getProjectSuggestedView(opened));
  }
  function updateProject(updated){setProject(updated);setProjects(prev=>prev.map(p=>p.id===updated.id?updated:p));}
  function deleteProject(id){
    setProjects(prev=>{
      const next=prev.filter(p=>p.id!==id);
      if(next.length===0)clearProjectStore().catch(()=>{});
      return next;
    });
    if(project?.id===id){setProject(null);setView('projects');}
  }

  function renderView(){
    if(loadingProjects){
      return <div style={{flex:1,padding:40,display:'flex',alignItems:'center',justifyContent:'center'}}><Card style={{padding:'34px 36px',maxWidth:420,textAlign:'center'}}><div style={{display:'flex',justifyContent:'center',marginBottom:12}}><ClapperIcon size={34} color="var(--teal)"/></div><div style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:8,letterSpacing:'-0.02em'}}>Loading your workspace…</div><div style={{fontSize:13,color:'var(--text-3)'}}>Reading saved projects from browser storage.</div></Card></div>;
    }
    if(view==='settings')return <SettingsPage onShowWelcome={()=>setShowWelcome(true)}/>;
    if(!project||view==='projects')return <ProjectsPage projects={projects} onCreate={createProject} onOpen={openProject} onDelete={deleteProject}/>;
    if(view==='upload')return <UploadStep project={project} onUpdate={updateProject}/>;
    if(view==='map')return <MapStep project={project} onUpdate={updateProject}/>;
    if(view==='review')return <ReviewStep project={project} onUpdate={updateProject}/>;
    if(view==='export')return <ExportStep project={project} onUpdate={updateProject}/>;
    return null;
  }

  const hasKey=!!loadApiKey();
  const saveLabel=saveState==='saving'?'Saving…':saveState==='saved'?'Saved':'Ready';
  const saveColor=saveState==='saving'?'navy':'green';

  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--bg)'}}>
      {showWelcome&&<WelcomeModal onDone={dismissWelcome}/>}
      <Sidebar view={view} setView={setView} project={project} setProject={p=>{setProject(p);if(!p)setView('projects');}} hasKey={hasKey}/>
      <div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
        <div style={{height:52,padding:'0 28px',borderBottom:'1px solid var(--border)',background:'rgba(8,12,20,0.8)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,position:'sticky',top:0,zIndex:20}}>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <Chip color={saveColor} small>{saveLabel}</Chip>
            <Chip color={storageMode==='indexeddb'?'green':'amber'} small>{storageMode==='indexeddb'?'IndexedDB storage':'Fallback storage'}</Chip>
            {project&&<span style={{fontSize:12,color:'var(--text-3)'}}>Current project: <strong style={{color:'var(--text)'}}>{project.name}</strong></span>}
          </div>
          <div style={{fontSize:12,color:'var(--text-3)',fontWeight:600}}>Film Incentive Manager</div>
        </div>
        {storageMessage&&<div style={{padding:'12px 24px 0'}}><Alert type={storageMode==='indexeddb'?'error':'warning'}>{storageMessage}</Alert></div>}
        {renderView()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
